<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost in the fog — Ether Fantasy Land</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/ui/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/theme.css">
<style>
  .lost{min-height:calc(100vh - var(--ef-header-h) - 220px);display:flex;align-items:center;justify-content:center;text-align:center;padding:64px 16px}
  .lost .code{font:700 clamp(64px,12vw,120px)/1 var(--ef-font-display);background:linear-gradient(135deg,#cfa6ff,#a855f7 55%,#5fe9d0);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
  .lost h1{font:700 clamp(22px,3vw,30px)/1.2 var(--ef-font-display);margin:10px 0 8px}
  .lost p{color:var(--ef-text-2);max-width:480px;margin:0 auto 26px}
  .lost .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style></head>
<body class="ef">
<main class="lost"><div>
  <p class="code">404</p>
  <h1>This land is lost in the fog.</h1>
  <p>The page you were looking for isn't here. Every real parcel is still on the map, though.</p>
  <div class="row">
    <a class="ef-btn ef-btn--primary" href="/designer/world">Open the World Atlas</a>
    <a class="ef-btn ef-btn--ghost" href="/designer">Go to the Designer</a>
    <a class="ef-btn ef-btn--ghost" href="/">Home</a>
  </div>
</div></main>
<script src="/ui/shell.js"></script>
</body></html>
