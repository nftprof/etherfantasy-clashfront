<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ether Fantasy — Land Maps</title>
<style>
  :root{--bg:#0d0f13;--panel:#161a21;--panel2:#1d222b;--line:#2a313c;--ink:#e7e3d2;--dim:#9aa3b0;--gold:#d9a441;--blue:#5b8fd6;--green:#5fa86a;--red:#c8624e}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1a2130,#0d0f13);color:var(--ink);
       font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);
         background:rgba(13,15,19,.7);backdrop-filter:blur(6px);position:sticky;top:0;z-index:10}
  header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
  header .sub{color:var(--dim);font-size:12.5px}
  .spacer{flex:1}
  .who{font-size:13px;color:var(--dim)}
  .who b{color:var(--gold)}
  button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
              border-radius:8px;padding:7px 13px;transition:.12s}
  button:hover,.btn:hover{border-color:var(--gold);color:#fff}
  .tabs{display:flex;gap:8px;padding:16px 22px 4px}
  .tab{border-radius:20px;padding:6px 15px;font-size:13.5px}
  .tab.on{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:600}
  .note{padding:2px 22px 10px;color:var(--dim);font-size:12.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:12px 22px 40px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
        display:flex;flex-direction:column;transition:.14s}
  .card:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 8px 26px rgba(0,0,0,.4)}
  .thumb{aspect-ratio:1/1;background:#0f1319 center/cover no-repeat;position:relative;display:flex;
         align-items:center;justify-content:center;color:#333c49;font-size:34px}
  .thumb .badge{position:absolute;top:8px;right:8px;font-size:10.5px;padding:2px 8px;border-radius:20px;
        background:rgba(13,15,19,.82);border:1px solid var(--line);letter-spacing:.3px}
  .badge.OWNER_FROZEN{color:var(--blue);border-color:var(--blue)}
  .badge.APPROVED,.badge.OK{color:var(--green);border-color:var(--green)}
  .badge.undesigned{color:var(--dim)}
  .meta{padding:10px 12px;display:flex;flex-direction:column;gap:3px}
  .meta .pid{font-weight:600;font-size:13.5px;letter-spacing:.3px}
  .meta .tags{color:var(--dim);font-size:11.5px;text-transform:capitalize}
  .meta .go{margin-top:8px;text-align:center;text-decoration:none;display:block}
  .empty{padding:60px 22px;text-align:center;color:var(--dim)}
  dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);
         padding:0;width:min(380px,92vw)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  .modal{padding:22px}
  .modal h3{margin:0 0 4px}
  .modal p{color:var(--dim);font-size:13px;margin:0 0 16px}
  .modal input{width:100%;margin-bottom:10px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);
        background:var(--panel2);color:var(--ink);font:inherit}
  .modal .err{color:var(--red);font-size:12.5px;min-height:16px}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
  a{color:var(--gold)}
</style>
</head>
<body>
<header>
  <h1>⚔ Ether Fantasy <span class="sub">— Land Maps</span></h1>
  <div class="spacer"></div>
  <div class="who" id="who">…</div>
  <button id="authbtn">Sign in</button>
</header>

<div class="tabs">
  <button class="tab on" data-tab="all">All maps</button>
  <button class="tab" data-tab="mine">My land</button>
</div>
<div class="note" id="note"></div>
<div class="grid" id="grid"></div>

<dialog id="login">
  <form class="modal" id="loginForm">
    <h3>Sign in to design land</h3>
    <p>Use your Pentagon Games account (the same login as the game). Viewing maps is open to everyone.</p>
    <input id="email" type="email" placeholder="email" autocomplete="username" required>
    <input id="pass" type="password" placeholder="password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <div class="row">
      <button type="button" id="loginCancel">Cancel</button>
      <button type="submit" class="btn" style="border-color:var(--gold);color:var(--gold)">Sign in</button>
    </div>
  </form>
</dialog>

<script>
const $=id=>document.getElementById(id);
const j=(u,o)=>fetch(u,o).then(r=>r.json());
let tok=null; try{tok=localStorage.getItem("ef_pg_token");}catch(e){}
let me=null, owners={}, designs=[], parcels=[], tab="all";
const hdrs=()=>tok?{authorization:"Bearer "+tok}:{};

async function refreshWho(){
  me=null;
  try{ if(tok){const r=await j("/internal/v1/whoami",{headers:hdrs()}); me=r.ok?r.username:null;} }catch(e){}
  if(me){ $("who").innerHTML=`signed in as <b>${me}</b> · <a href="#" id="out">sign out</a>`;
          $("authbtn").hidden=true; $("out").onclick=e=>{e.preventDefault();try{localStorage.removeItem("ef_pg_token");}catch(_){}tok=null;refreshWho();render();}; }
  else{ $("who").textContent="viewing as guest"; $("authbtn").hidden=false; }
}
$("authbtn").onclick=()=>{$("loginErr").textContent="";$("login").showModal();};
$("loginCancel").onclick=()=>$("login").close();
$("loginForm").onsubmit=async e=>{
  e.preventDefault(); $("loginErr").textContent="…";
  try{
    const r=await j("/internal/v1/login",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({email:$("email").value.trim(),password:$("pass").value})});
    if(!r.ok)throw new Error(r.error||"login failed");
    tok=r.token; try{localStorage.setItem("ef_pg_token",r.token);}catch(_){}
    $("login").close(); await refreshWho(); if(tab==="mine")render();
  }catch(err){$("loginErr").textContent=err.message;}
};

async function load(){
  const [dz,pz,oz]=await Promise.all([
    j("/internal/v1/designs").catch(()=>({rows:[]})),
    j("/internal/v1/parcels").catch(()=>({parcels:[]})),
    j("/gallery/owners").catch(()=>({owners:{}})),
  ]);
  designs=dz.rows||[]; parcels=pz.parcels||[]; owners=(oz.owners)||{};
  // merge design status onto parcels for "my land" (owned parcels, designed or not)
  const byId=new Map(designs.map(r=>[String(r.parcelId),r]));
  parcels=parcels.map(p=>({...p,...(byId.get(String(p.parcelId))||{})}));
}

function badge(r){
  if(r.status==="OWNER_FROZEN")return`<span class="badge OWNER_FROZEN">frozen</span>`;
  if(r.status && r.approved!==false)return`<span class="badge APPROVED">v${r.v??r.designVersion??0}</span>`;
  if(r.status)return`<span class="badge OK">v${r.v??r.designVersion??0}</span>`;
  return`<span class="badge undesigned">no design</span>`;
}
function card(r){
  const id=String(r.parcelId), designed=!!r.status;
  const tags=[r.archetype,r.palette].filter(Boolean).join(" · ")||(designed?"":"click to design");
  const thumb=designed?`background-image:url(/internal/v1/designs/${id}/thumb.png?v=${r.v??r.designVersion??0})`:"";
  return`<div class="card">
    <a class="thumb" style="${thumb}" href="/designer?parcel=${id}">${designed?"":"🗺"}${badge(r)}</a>
    <div class="meta">
      <span class="pid">📍 ${id}</span>
      <span class="tags">${tags}${r.score!=null?` · score ${r.score}`:""}</span>
      <a class="go btn" href="/designer?parcel=${id}">${designed?"Open in designer":"Design this land"}</a>
    </div>
  </div>`;
}

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===tab));
  let rows, note;
  if(tab==="all"){
    rows=designs.map(r=>({...r,v:r.designVersion}));
    note=`${rows.length} designed map${rows.length===1?"":"s"} — anyone can view; sign in as the owner to redesign.`;
  }else{
    if(!me){ $("grid").innerHTML=""; $("note").innerHTML=`Sign in to see the land you own. <a href="#" id="ni">Sign in</a>`;
             $("ni").onclick=e=>{e.preventDefault();$("login").showModal();}; return; }
    const mine=String(me).toLowerCase();
    rows=parcels.filter(p=>String(owners[String(p.parcelId)]||"").toLowerCase()===mine);
    const feedOn=Object.keys(owners).length>0;
    note=feedOn?`${rows.length} parcel${rows.length===1?"":"s"} owned by ${me}.`
               :`Ownership feed not wired yet — every signed-in account may design any parcel during testing. (Point the map service at CF's /api/land-owners to enforce ownership.)`;
    if(!feedOn) rows=parcels; // testing phase: show all designable parcels
  }
  $("note").textContent=note;
  if(!rows.length){ $("grid").innerHTML=`<div class="empty">No maps here yet.</div>`; return; }
  const MAX=600;
  $("grid").innerHTML=rows.slice(0,MAX).map(card).join("");
  if(rows.length>MAX) $("note").textContent+=` (showing first ${MAX})`;
}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{tab=t.dataset.tab;render();});

(async()=>{ await refreshWho(); await load(); render(); })();
</script>
</body>
</html>
