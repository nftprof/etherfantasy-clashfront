<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EF — Battlefield 3D preview</title>
<style>
  body{margin:0;background:#0d1420;color:#ece9f5;font-family:"Inter",system-ui,Segoe UI,sans-serif;overflow:hidden}
  #hud{position:fixed;top:10px;left:12px;z-index:10;background:rgba(5,4,9,.78);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 14px;font-size:12.5px;max-width:340px;backdrop-filter:blur(6px)}
  #hud b{color:#d8bbff} .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .chips span{font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:#9cf6e4}
  #north{position:fixed;top:10px;right:14px;z-index:10;color:#a8a3bf;font-size:13px}
  #err{position:fixed;top:45%;width:100%;text-align:center;color:#f0556b;z-index:10}
  #hint{position:fixed;bottom:10px;left:12px;z-index:10;color:#8b94a3;font-size:11.5px}
  #hint button{font:inherit;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#ece9f5;border-radius:8px;padding:4px 10px;cursor:pointer;margin-right:10px}
</style>
</head>
<body>
<div id="hud">loading battlefield…</div>
<div id="north">⬆ N</div>
<div id="hint"><button id="texBtn">🎨 grass</button>drag = orbit · wheel = zoom · right-drag = pan · game-style render (the in-engine render is hero mode)</div>
<div id="err"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async function(){
const q=new URLSearchParams(location.search), pid=q.get("parcel"), vv=q.get("v");
if(!pid){document.getElementById("err").textContent="missing ?parcel=<id>";return;}
let d; try{ d=await fetch(`/internal/v1/designs/${pid}${vv!=null?`?v=${vv}`:""}`).then(r=>r.json()); }catch(e){}
if(!d||!d.ok||!d.artifact){document.getElementById("err").textContent="could not load design "+pid;return;}
const a=d.artifact, T={OPEN:0,FOREST:1,ROCK:2,WATER:3,CLIFF:4,ROAD:5,OOB:6};
const G=a.terrain.w, CELL=a.terrain.cellM, S=a.arena.sizeM, half=S/2;
const cells=Uint8Array.from(atob(a.terrain.cells),c=>c.charCodeAt(0));
const p=a.meta.params||{}, lava=p.palette==="volcanic";
// engine-ready render manifest → heightfield (the biggest fidelity gap: a flat grid reads as
// cardboard). Optional: if it 404s or the converter is off, everything falls back to flat ground.
let man=null; try{ man=await fetch(`/internal/v1/designs/${pid}/render.json${vv!=null?`?v=${vv}`:""}`).then(r=>r.ok?r.json():null); }catch(e){}
let hgrid=null,hw=0,hh=0,hmin=0,hmax=0;
if(man&&man.height){hgrid=Uint8Array.from(atob(man.height.data),c=>c.charCodeAt(0));hw=man.height.w;hh=man.height.h;hmin=man.height.hMin;hmax=man.height.hMax;}
function hAt(x,z){ if(!hgrid)return 0;
  const fx=(x+half)/CELL-0.5, fz=(z+half)/CELL-0.5;
  const x0=Math.max(0,Math.min(hw-1,Math.floor(fx))), z0=Math.max(0,Math.min(hh-1,Math.floor(fz)));
  const x1=Math.min(hw-1,x0+1), z1=Math.min(hh-1,z0+1), tx=fx-x0, tz=fz-z0;
  const s=(cx,cz)=>hgrid[cz*hw+cx]/255;
  const v=s(x0,z0)*(1-tx)*(1-tz)+s(x1,z0)*tx*(1-tz)+s(x0,z1)*(1-tx)*tz+s(x1,z1)*tx*tz;
  return hmin+v*(hmax-hmin); }
// displace a flat XZ plane geometry onto the heightfield (local z → world y after the -90° X rot)
function drape(geo,yoff){ if(!hgrid)return geo; const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){const lx=pos.getX(i),ly=pos.getY(i);pos.setZ(i,hAt(lx,-ly)+(yoff||0));} geo.computeVertexNormals(); return geo; }
// deterministic rng seeded from the artifact (same look for every viewer/load)
let _s=((a.meta&&a.meta.seed)>>>0)||1;
const rng=()=>{_s=(_s+0x6D2B79F5)>>>0;let t=_s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};
const R=(x,y)=>x+(y-x)*rng();

// per-palette ground tint (grass texture is warm green; multiply toward the biome)
const TINT={verdant:0xffffff,autumn:0xd9b978,volcanic:0x6a5a52,tundra:0xcdd6da,desert:0xd8c28a,swamp:0x8fa06a,ashen:0x9a938c,sakura:0xe6c8d6}[p.palette]||0xffffff;

const scene=new THREE.Scene();
// vertical gradient sky (biome-aware) instead of a flat void — reads as an environment
function skyTex(top,bot){const c=document.createElement('canvas');c.width=8;c.height=256;const g=c.getContext('2d');const grd=g.createLinearGradient(0,0,0,256);grd.addColorStop(0,top);grd.addColorStop(0.62,bot);grd.addColorStop(1,bot);g.fillStyle=grd;g.fillRect(0,0,8,256);return new THREE.CanvasTexture(c);}
scene.background=skyTex(lava?'#4a1c0a':'#3a5578', lava?'#120806':'#0e1622');
scene.fog=new THREE.Fog(lava?0x1a0f0c:0x111c2b, S*0.95, S*2.6);
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,S*6);
cam.position.set(0,S*1.0,S*0.68); cam.lookAt(0,0,0);
const ren=new THREE.WebGLRenderer({antialias:true}); ren.setSize(innerWidth,innerHeight); ren.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(ren.domElement);
const ctl=new THREE.OrbitControls(cam,ren.domElement); ctl.maxPolarAngle=Math.PI*0.49; ctl.target.set(0,0,0);
// GAME lighting (index.html): hemisphere sky/ground + warm sun
scene.add(new THREE.HemisphereLight(lava?0xffb27a:0xbfd4ff, 0x223044, 0.9));
const sun=new THREE.DirectionalLight(0xfff2dd,0.8); sun.position.set(S*0.25,S*0.42,S*0.17); scene.add(sun);
const MAXA=ren.capabilities.getMaxAnisotropy();
const world=(x,z)=>new THREE.Vector3(x,0,-z);           // artifact +z north → three -z
const put=(mesh,x,z,y=0)=>{const w=world(x,z);mesh.position.set(w.x,y+hAt(x,z),w.z);scene.add(mesh);return mesh;};
const lam=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));

// ---- ground: the game's makeGrassTexture (index.html verbatim), biome-tinted, polygon-cut ----
function makeGrassTexture(){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');const Sz=512;
 x.fillStyle='#557f49';x.fillRect(0,0,Sz,Sz);
 const tile=(fn)=>{for(let oy=-Sz;oy<=Sz;oy+=Sz)for(let ox=-Sz;ox<=Sz;ox+=Sz){x.save();x.translate(ox,oy);fn();x.restore();}};
 const macro=['#6a9a58','#7aa861','#4f7a45'];
 for(let i=0;i<7;i++){const mc=macro[i%3],px=rng()*Sz,py=rng()*Sz,r=180+rng()*150;tile(()=>{const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,mc);g.addColorStop(1,'rgba(0,0,0,0)');x.globalAlpha=.10;x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.globalAlpha=1;});}
 const patches=[['#6f9d5a',38],['#618c4d',32],['#80ac63',24]];
 for(let i=0;i<38;i++){const cc=patches[(rng()*3)|0],px=rng()*Sz,py=rng()*Sz,r=cc[1]*(.6+rng()*.8);tile(()=>{const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,cc[0]);g.addColorStop(1,'rgba(0,0,0,0)');x.globalAlpha=.18;x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.globalAlpha=1;});}
 const blades=['#74a257','#5e8a49','#88b266','#52864a'];x.lineCap='round';
 for(let i=0;i<1150;i++){const bx=rng()*Sz,by=rng()*Sz,len=4+rng()*8,bend=(rng()-.5)*5,col=blades[(rng()*4)|0],al=.13+rng()*.18,lw=.6+rng()*.7;tile(()=>{x.strokeStyle=col;x.globalAlpha=al;x.lineWidth=lw;x.beginPath();x.moveTo(bx,by);x.quadraticCurveTo(bx+bend,by-len*.6,bx+bend*.4,by-len);x.stroke();});}
 x.globalAlpha=1;
 for(let i=0;i<2200;i++){x.fillStyle=rng()<.6?'rgba(255,255,255,.020)':'rgba(0,0,0,.020)';x.fillRect(rng()*Sz,rng()*Sz,1,1);}
 const t=new THREE.CanvasTexture(c);t.anisotropy=MAXA;return t;}
const grassTex=makeGrassTexture(); grassTex.wrapS=grassTex.wrapT=THREE.RepeatWrapping; grassTex.repeat.set(12,12); grassTex.center.set(.5,.5); grassTex.rotation=.16;
// polygon alpha mask (OOB → transparent = the parcel silhouette floats in the void)
const mcv=document.createElement('canvas'); mcv.width=mcv.height=G; const m2=mcv.getContext('2d');
for(let z=0;z<G;z++)for(let x=0;x<G;x++){m2.fillStyle=cells[z*G+x]===T.OOB?'#000':'#fff';m2.fillRect(x,G-1-z,1,1);}
const mask=new THREE.CanvasTexture(mcv);
const ground=new THREE.Mesh(drape(new THREE.PlaneGeometry(S,S,hgrid?hw-1:1,hgrid?hh-1:1)),new THREE.MeshLambertMaterial({map:grassTex,color:TINT,alphaMap:mask,transparent:true,alphaTest:.5}));
ground.rotation.x=-Math.PI/2; scene.add(ground);

// misty base plane below the parcel so the silhouette sits in a haze-sea, not a black void
const haze=new THREE.Mesh(new THREE.PlaneGeometry(S*4.5,S*4.5),new THREE.MeshBasicMaterial({color:lava?0x2a120c:0x16243a,transparent:true,opacity:.92}));
haze.rotation.x=-Math.PI/2; haze.position.y=-3.5; scene.add(haze);

// upscale + feather a G×G cell canvas so coastlines/roads read smooth instead of pixel-blocky
function soften(src,scale,blur){const o=document.createElement('canvas');o.width=o.height=src.width*scale;const g=o.getContext('2d');g.imageSmoothingEnabled=true;g.filter='blur('+blur+'px)';g.drawImage(src,0,0,o.width,o.height);g.filter='none';return o;}
function cellCanvas(pred,style){const cc=document.createElement('canvas');cc.width=cc.height=G;const g2=cc.getContext('2d');let any=false;for(let z=0;z<G;z++)for(let x=0;x<G;x++)if(pred(cells[z*G+x])){g2.fillStyle=style;g2.fillRect(x,G-1-z,1,1);any=true;}return any?cc:null;}
function plane(tex,y,mat){tex.minFilter=tex.magFilter=THREE.LinearFilter;const m=new THREE.Mesh(drape(new THREE.PlaneGeometry(S,S,hgrid?hw-1:1,hgrid?hh-1:1),y),mat);m.material.map=tex;m.rotation.x=-Math.PI/2;if(!hgrid)m.position.y=y;scene.add(m);return m;}
// road: dirt, softened edges
{const cc=cellCanvas(c=>c===T.ROAD,'rgba(120,96,58,.9)');if(cc)plane(new THREE.CanvasTexture(soften(cc,4,3)),0.15,new THREE.MeshBasicMaterial({transparent:true,depthWrite:false}));}
// water: softened coastline + glossy phong so the sun glints off it (lava = emissive glow)
{const cc=cellCanvas(c=>c===T.WATER, lava?'rgba(255,120,45,.96)':'rgba(64,116,172,.86)');
 if(cc){const wm=plane(new THREE.CanvasTexture(soften(cc,4,3.5)),0.28,new THREE.MeshPhongMaterial({transparent:true,depthWrite:false,shininess:lava?8:95,specular:lava?0x1a0a00:0x8fb8ee,emissive:lava?0xff5a1e:0x0a1a2e,emissiveIntensity:lava?.55:.12}));wm.renderOrder=1;}}

// ---- props: the game's exact tree / rock / gold / wood / tower visuals ----
const treeLeaf=(h,l)=>new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(0.30+h,0.34+0.16*l,0.16+0.10*l),flatShading:true});
const rockMat=new THREE.MeshLambertMaterial({color:0x6e6a63,flatShading:true});
const stoneTex=(function(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
 x.fillStyle='#3d4757';x.fillRect(0,0,128,128);const rh=128/6,bw=32;
 for(let r=0;r<6;r++){const y=r*rh,off=(r%2)?16:0;for(let bx=-32;bx<128;bx+=bw){const px=bx+off,t=0.84+rng()*0.28;
   x.fillStyle=`rgb(${Math.min(255,0x5a*t|0)},${Math.min(255,0x68*t|0)},${Math.min(255,0x80*t|0)})`;x.fillRect(px+1.4,y+1.4,bw-2.8,rh-2.8);}}
 for(let i=0;i<260;i++){x.fillStyle=(rng()<.5?'rgba(255,255,255,':'rgba(0,0,0,')+(rng()*.1).toFixed(3)+')';x.fillRect(rng()*128,rng()*128,1,1);}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,3);t.anisotropy=MAXA;return t;})();

for(const o of a.obstacles||[]){
  if(o.kind==="TREE"){const s=o.r/2.9, tr=new THREE.Group();
    const leaf=treeLeaf(R(-0.03,0.04),rng());
    const lower=new THREE.Mesh(new THREE.ConeGeometry(3.0*s,6.5*s,7),leaf);lower.position.y=3.6*s;
    const upper=new THREE.Mesh(new THREE.ConeGeometry(2.0*s,5.5*s,7),leaf);upper.position.y=6.2*s;
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.5*s,0.7*s,3*s,5),lam(0x3a2a1c));trunk.position.y=1.5*s;
    tr.add(trunk,lower,upper);tr.rotation.y=rng()*6.28;put(tr,o.x,o.z);}
  else if(o.kind==="ROCK"){const rk=new THREE.Mesh(new THREE.DodecahedronGeometry(o.r*0.85),rockMat);
    rk.rotation.set(rng()*3,rng()*6,rng()*3);put(rk,o.x,o.z,o.r*0.3);}
  else{ // landmark hero prop
    const lm=new THREE.Mesh(new THREE.ConeGeometry(4,22,4),new THREE.MeshLambertMaterial({color:0xf2e6be,emissive:0x8a6d2a}));
    put(lm,o.x,o.z,11);}
}
// gold = the game's 5-octahedron cluster · wood = 3 clustered pines (index.html mkNode verbatim)
for(const r of a.resources||[]){
  const grp=new THREE.Group();
  if(r.kind==="WOOD_GROVE"){for(let i=0;i<3;i++){const t=new THREE.Group();
    t.add(new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,2.4,6),lam(0x5a3b22)).translateY(1.2));
    t.add(new THREE.Mesh(new THREE.ConeGeometry(1.7,3.6,7),lam(0x2f7d3a)).translateY(3));
    t.position.set((i-1)*1.8,0,(i%2)*1.4-.7);grp.add(t);}}
  else{for(let i=0;i<5;i++){const mm=new THREE.Mesh(new THREE.OctahedronGeometry(.7+rng()*.4),new THREE.MeshLambertMaterial({color:0xffd34d,emissive:0x6b5300,emissiveIntensity:.5}));
    mm.position.set((rng()-.5)*2.4,.6+rng()*.5,(rng()-.5)*2.4);grp.add(mm);}}
  put(grp,r.x,r.z);
}
// land-owned towers (stone) · wild camps · build pads
for(const s of a.structures||[]){const tw=new THREE.Group();
  tw.add(new THREE.Mesh(new THREE.CylinderGeometry(3,4,14,10),new THREE.MeshLambertMaterial({map:stoneTex})));
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(4.4,4.4,2.4,10),new THREE.MeshLambertMaterial({map:stoneTex}));cap.position.y=8;tw.add(cap);
  put(tw,s.x,s.z,7);}
for(const mb of a.mobs||[]){const c=new THREE.Mesh(new THREE.TetrahedronGeometry(3.4),new THREE.MeshLambertMaterial({color:0xc04ac0,emissive:0x501050}));put(c,mb.x,mb.z,2.4);}
for(const b of a.buildSpots||[]){const pad=new THREE.Mesh(new THREE.CylinderGeometry(b.size*0.6,b.size*0.6,0.4,12),lam(0x3a4152));put(pad,b.x,b.z,0.25);}
// destructible HP-gates: a low breachable wall spanning the cells it opens, colored by kind
const GATE={FOREST_WALL:0x6b4a2a,BOULDER_PILE:0x6e6a63,PORTCULLIS:0x8a7c4a,ICE_WALL:0x9fd0e6};
for(const b of a.barriers||[]){const cells=b.opens||[[b.x,b.z]];const w=Math.max(4,Math.hypot(cells[cells.length-1][0]-cells[0][0],cells[cells.length-1][1]-cells[0][1])+CELL*2);
  const horiz=Math.abs(cells[cells.length-1][0]-cells[0][0])>=Math.abs(cells[cells.length-1][1]-cells[0][1]);
  const wall=new THREE.Mesh(new THREE.BoxGeometry(horiz?w:CELL*1.4,3.2,horiz?CELL*1.4:w),new THREE.MeshLambertMaterial({color:GATE[b.kind]||0x7a6a4a,emissive:b.kind==="ICE_WALL"?0x224455:0x000000,flatShading:true}));put(wall,b.x,b.z,1.6);}
// spawn rings + dotted lanes
for(const s of a.spawnZones||[]){if(s.side==="ANY")continue;
  const ring=new THREE.Mesh(new THREE.TorusGeometry(7,0.7,8,24),new THREE.MeshBasicMaterial({color:s.side==="ATTACKER"?0xe25a50:0x5a8ee2}));
  ring.rotation.x=Math.PI/2;put(ring,s.x,s.z,0.8);}
for(const lane of a.lanes||[])for(let i=0;i<lane.length-1;i++){const [ax,az]=lane[i],[bx,bz]=lane[i+1];
  const steps=Math.max(2,Math.round(Math.hypot(bx-ax,bz-az)/8));
  for(let s=0;s<=steps;s+=2){const dot=new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.9,0.3,6),new THREE.MeshBasicMaterial({color:0xd2be8c}));put(dot,ax+(bx-ax)*s/steps,az+(bz-az)*s/steps,0.35);}}

// grass ↔ raw-cells toggle (raw = exact generator terrain, for design QA)
let raw=false;
document.getElementById("texBtn").onclick=()=>{raw=!raw;
  if(raw){const cc=document.createElement('canvas');cc.width=cc.height=G;const g2=cc.getContext('2d');
    const C=[[86,118,72],[38,72,40],[110,106,98],[52,86,120],[90,82,74],[150,132,96]];
    for(let z=0;z<G;z++)for(let x=0;x<G;x++){const c=cells[z*G+x];if(c===T.OOB)continue;const q=C[Math.min(c,5)];g2.fillStyle=`rgb(${q[0]},${q[1]},${q[2]})`;g2.fillRect(x,G-1-z,1,1);}
    const tx=new THREE.CanvasTexture(cc);tx.magFilter=THREE.NearestFilter;ground.material.map=tx;ground.material.color.set(0xffffff);}
  else{ground.material.map=grassTex;ground.material.color.setHex(TINT);}
  ground.material.needsUpdate=true;document.getElementById("texBtn").textContent=raw?"🎨 cells":"🎨 grass";};

// HUD
const bud=d.budget||{},row=d.row||{};
document.getElementById("hud").innerHTML=`<b>${pid}</b> · v${a.meta?.designVersion??row.designVersion??"?"} · ${row.status||""}<div class="chips">`+
 [p.archetype,p.palette,p.landmark!=="NONE"?p.landmark:null,(a.laneCount||1)+" lane(s)",
  (a.resources||[]).length+" nodes",(a.mobs||[]).length+" camps",(a.structures||[]).length+" towers",
  (a.barriers||[]).length?((a.barriers).length+" gates"):null,(a.meta?.modes||[]).join("/")||null,
  hgrid?"⛰ heightfield":"▱ flat (no manifest)",man?.biome?.key?("🌿 "+man.biome.key):null,
  bud.name?("🏦 "+bud.name):null].filter(Boolean).map(x=>`<span>${x}</span>`).join("")+`</div>`;

addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop);ctl.update();ren.render(scene,cam);})();
})();
</script>
</body>
</html>
