<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EF — Battlefield 3D preview</title>
<style>
  body{margin:0;background:#0d1420;color:#ece9f5;font-family:"Inter",system-ui,Segoe UI,sans-serif;overflow:hidden}
  #hud{position:fixed;top:10px;left:12px;z-index:10;background:rgba(5,4,9,.78);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 14px;font-size:12.5px;max-width:340px;backdrop-filter:blur(6px)}
  #hud b{color:#d8bbff} .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .chips span{font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:#9cf6e4}
  #north{position:fixed;top:10px;right:14px;z-index:10;color:#a8a3bf;font-size:13px}
  #err{position:fixed;top:45%;width:100%;text-align:center;color:#f0556b;z-index:10}
  #hint{position:fixed;bottom:10px;left:12px;z-index:10;color:#8b94a3;font-size:11.5px}
  #hint button{font:inherit;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#ece9f5;border-radius:8px;padding:4px 10px;cursor:pointer;margin-right:10px}
</style>
</head>
<body>
<div id="hud">loading battlefield…</div>
<div id="north">⬆ N</div>
<div id="hint"><button id="texBtn">🎨 grass</button><button id="colBtn">⛔ collision</button><button id="pathBtn">🧭 paths</button>drag = orbit · wheel = zoom · right-drag = pan</div>
<div id="err"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async function(){
const q=new URLSearchParams(location.search), pid=q.get("parcel"), vv=q.get("v");
if(!pid){document.getElementById("err").textContent="missing ?parcel=<id>";return;}
let d; try{ d=await fetch(`/internal/v1/designs/${pid}${vv!=null?`?v=${vv}`:""}`).then(r=>r.json()); }catch(e){}
if(!d||!d.ok||!d.artifact){document.getElementById("err").textContent="could not load design "+pid;return;}
const a=d.artifact, T={OPEN:0,FOREST:1,ROCK:2,WATER:3,CLIFF:4,ROAD:5,OOB:6};
const G=a.terrain.w, CELL=a.terrain.cellM, S=a.arena.sizeM, half=S/2;
const cells=Uint8Array.from(atob(a.terrain.cells),c=>c.charCodeAt(0));
const p=a.meta.params||{}, lava=p.palette==="volcanic";
// THEME (v24 pilot — visuals only; gameplay identical): the CF kit carries the skin until the
// engine ships asset packs. A themed map renders on the LEGACY path (ours) by design.
const theme=(a.meta&&a.meta.theme)||null;
// v24.1 (owner: "went too far — keep land NORMAL, cosmetic first; take more care designing the
// candy"): the theme no longer repaints the world. Ground/sky/fog/cliffs render exactly like the
// biome; the candy is IN THE OBJECTS — designed lollipops & candy canes, gumdrop boulders, a
// soda river, graham roads, a gingerbread-and-icing castle.
const THEMES={candyland:{
  water:{color:0xe8558e,shallow:[1.0,0.82,0.90],deep:[0.72,0.18,0.42],op:0.9,shin:120,spec:0xffc0dd,em:0x2a0f1c,emI:0.22,bump:0.3,speed:0.8},
  road:'rgba(214,178,116,.92)', rock:[0xff6fa5,0x7fe0c3,0xffd166,0xb18cff,0x6fd3ff], trunk:0xfff5f0}}[theme]||null;
// engine-ready render manifest (battlefield_converter.cjs output). With it, the preview renders
// THE GAME's nine layers via EF_BATTLEFIELD — the same scene builder the MOBA client runs, so what
// the designer sees IS the final look. Without it (404/converter off) → legacy flat fallback.
let man=null; try{ man=await fetch(`/internal/v1/designs/${pid}/render.json${vv!=null?`?v=${vv}`:""}`).then(r=>r.ok?r.json():null); }catch(e){}
if(man&&(man.ok===false||!man.height))man=null;
// load the game's scene builder (skipped if already inlined — the standalone offline viewer does
// that). Default = the UNIFIED shared renderer (MOBA-owned ef_battlefield_renderer.js, V3+);
// ?legacyRenderer=1 = the pre-unification module (served from the .bak) — the switchover rollback.
function loadScript(src){return new Promise((ok,bad)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=bad;document.head.appendChild(s);});}
let parity=false;
const RENDERER_SRC=q.get("legacyRenderer")?"/ef_battlefield.js":"/ef_battlefield_renderer.js";
if(man&&!THEMES){ if(!window.EF_BATTLEFIELD){ try{ await loadScript(RENDERER_SRC); }catch(e){} } parity=!!window.EF_BATTLEFIELD; }
let hgrid=null,hw=0,hh=0,hmin=0,hmax=0;
if(man&&man.height){hgrid=Uint8Array.from(atob(man.height.data),c=>c.charCodeAt(0));hw=man.height.w;hh=man.height.h;hmin=man.height.hMin;hmax=man.height.hMax;}
function hAt(x,z){ if(!hgrid)return 0;
  const fx=(x+half)/CELL-0.5, fz=(z+half)/CELL-0.5;
  const x0=Math.max(0,Math.min(hw-1,Math.floor(fx))), z0=Math.max(0,Math.min(hh-1,Math.floor(fz)));
  const x1=Math.min(hw-1,x0+1), z1=Math.min(hh-1,z0+1), tx=fx-x0, tz=fz-z0;
  const s=(cx,cz)=>hgrid[cz*hw+cx]/255;
  const v=s(x0,z0)*(1-tx)*(1-tz)+s(x1,z0)*tx*(1-tz)+s(x0,z1)*(1-tx)*tz+s(x1,z1)*tx*tz;
  return hmin+v*(hmax-hmin); }
// displace a flat XZ plane geometry onto the heightfield (local z → world y after the -90° X rot).
// ZS = the z-axis convention: EF_BATTLEFIELD renders manifest coords AS three.js coords (+z toward
// default camera), the legacy path mirrors (+z north → three -z). Overlays must match the ground.
const ZS=parity?1:-1;
function drape(geo,yoff){ if(!hgrid)return geo; const pos=geo.attributes.position;
  // -ly is correct in BOTH conventions: the -90° X rotation maps local +y → world -z, and the two
  // conventions differ only in what world z MEANS — the vertex→height lookup stays hAt(lx,-ly).
  for(let i=0;i<pos.count;i++){const lx=pos.getX(i),ly=pos.getY(i);pos.setZ(i,hAt(lx,-ly)+(yoff||0));} geo.computeVertexNormals(); return geo; }
// deterministic rng seeded from the artifact (same look for every viewer/load)
let _s=((a.meta&&a.meta.seed)>>>0)||1;
const rng=()=>{_s=(_s+0x6D2B79F5)>>>0;let t=_s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};
const R=(x,y)=>x+(y-x)*rng();

// per-palette ground tint (legacy fallback only — parity mode gets the real biome material set)
const TINT={verdant:0xffffff,autumn:0xd9b978,volcanic:0x6a5a52,tundra:0xcdd6da,desert:0xd8c28a,swamp:0x8fa06a,sakura:0xe6c8d6}[p.palette]||0xffffff;

const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(parity?50:45,innerWidth/innerHeight,1,S*6);
// north-up from either convention: sit the camera on the SOUTH side of the arena.
// parity: frame off the manifest's suggested orbit radius (the game-ish view distance)
const camR=parity?(man.camera&&man.camera.radius||S*0.62):S;
cam.position.set(0,parity?camR*0.85:S*1.0,ZS*-(parity?camR*0.62:S*0.68)); cam.lookAt(0,0,0);
const ren=new THREE.WebGLRenderer({antialias:true}); ren.setSize(innerWidth,innerHeight); ren.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(ren.domElement);
const ctl=new THREE.OrbitControls(cam,ren.domElement); ctl.maxPolarAngle=Math.PI*0.49; ctl.target.set(0,0,0);
const MAXA=ren.capabilities.getMaxAnisotropy();
const world=(x,z)=>new THREE.Vector3(x,0,ZS*z);
const put=(mesh,x,z,y=0)=>{const w=world(x,z);mesh.position.set(w.x,y+hAt(x,z),w.z);scene.add(mesh);return mesh;};
const lam=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));

// CASTLE-ARCHITECTURE-SPEC §3/§5: the tiered-fortress geometry (converter passes it through the
// manifest verbatim; older cached manifests fall back to the artifact's meta). When present, the
// castle KIT below owns ALL castle_* visuals — walls/gates/towers are filtered from both the
// module placeholders and the legacy per-anchor boxes so nothing double-renders.
const CG=(man&&man.castleGeom)||(a.meta&&a.meta.castleGeom)||null;
const isCastleAnchor=(s)=>CG&&/^castle_/.test(s.anchorId||"");
let bf=null, ground=null, grassTex=null;
if(parity){
  // ============ THE GAME RENDER — EF_BATTLEFIELD, all nine layers, verbatim ============
  // V3+ renders CORE/GATE/TOWER placeholders itself from opts.structures (artifact shape) — hand
  // it everything except WALL segments (no wall vocabulary yet; castle walls stay our overlay
  // until CASTLE-ARCHITECTURE-SPEC lands in the module). V1 (legacy .bak) ignores the extra opts.
  // fountains stripped (owner 2026-07-21: the module's flat spawn pads clip into sloped terrain —
  // "can u make them floating above as well") — every spawn/entry marker is a FLOATING BEACON now
  // (the block below), so the module draws no ground pads at all.
  bf=EF_BATTLEFIELD.buildBattlefield(scene,{manifest:{...man,fountains:[]},THREE,floorsBase:"/floors/",addLights:true,addFog:true,
    structures:(a.structures||[]).filter(s=>s.kind!=="WALL"&&!isCastleAnchor(s))});
}else{
  // ============ legacy fallback (no manifest / converter off): approximate look ============
  function skyTex(top,bot){const c=document.createElement('canvas');c.width=8;c.height=256;const g=c.getContext('2d');const grd=g.createLinearGradient(0,0,0,256);grd.addColorStop(0,top);grd.addColorStop(0.62,bot);grd.addColorStop(1,bot);g.fillStyle=grd;g.fillRect(0,0,8,256);return new THREE.CanvasTexture(c);}
  scene.background=skyTex(lava?'#4a1c0a':'#3a5578', lava?'#120806':'#0e1622');
  scene.fog=new THREE.Fog(lava?0x1a0f0c:0x111c2b, S*0.95, S*2.6);
  scene.add(new THREE.HemisphereLight(lava?0xffb27a:0xbfd4ff, 0x223044, 0.9));
  const sun=new THREE.DirectionalLight(0xfff2dd,0.8); sun.position.set(S*0.25,S*0.42,S*0.17); scene.add(sun);
  // ground: the game's makeGrassTexture (index.html verbatim), biome-tinted, polygon-cut
  function makeGrassTexture(){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');const Sz=512;
   x.fillStyle='#557f49';x.fillRect(0,0,Sz,Sz);
   const tile=(fn)=>{for(let oy=-Sz;oy<=Sz;oy+=Sz)for(let ox=-Sz;ox<=Sz;ox+=Sz){x.save();x.translate(ox,oy);fn();x.restore();}};
   const macro=['#6a9a58','#7aa861','#4f7a45'];
   for(let i=0;i<7;i++){const mc=macro[i%3],px=rng()*Sz,py=rng()*Sz,r=180+rng()*150;tile(()=>{const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,mc);g.addColorStop(1,'rgba(0,0,0,0)');x.globalAlpha=.10;x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.globalAlpha=1;});}
   const patches=[['#6f9d5a',38],['#618c4d',32],['#80ac63',24]];
   for(let i=0;i<38;i++){const cc=patches[(rng()*3)|0],px=rng()*Sz,py=rng()*Sz,r=cc[1]*(.6+rng()*.8);tile(()=>{const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,cc[0]);g.addColorStop(1,'rgba(0,0,0,0)');x.globalAlpha=.18;x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.globalAlpha=1;});}
   const blades=['#74a257','#5e8a49','#88b266','#52864a'];x.lineCap='round';
   for(let i=0;i<1150;i++){const bx=rng()*Sz,by=rng()*Sz,len=4+rng()*8,bend=(rng()-.5)*5,col=blades[(rng()*4)|0],al=.13+rng()*.18,lw=.6+rng()*.7;tile(()=>{x.strokeStyle=col;x.globalAlpha=al;x.lineWidth=lw;x.beginPath();x.moveTo(bx,by);x.quadraticCurveTo(bx+bend,by-len*.6,bx+bend*.4,by-len);x.stroke();});}
   x.globalAlpha=1;
   for(let i=0;i<2200;i++){x.fillStyle=rng()<.6?'rgba(255,255,255,.020)':'rgba(0,0,0,.020)';x.fillRect(rng()*Sz,rng()*Sz,1,1);}
   const t=new THREE.CanvasTexture(c);t.anisotropy=MAXA;return t;}
  grassTex=makeGrassTexture(); grassTex.wrapS=grassTex.wrapT=THREE.RepeatWrapping; grassTex.repeat.set(12,12); grassTex.center.set(.5,.5); grassTex.rotation=.16;
  // polygon alpha mask (OOB → transparent = the parcel silhouette floats in the void)
  const mcv=document.createElement('canvas'); mcv.width=mcv.height=G; const m2=mcv.getContext('2d');
  for(let z=0;z<G;z++)for(let x=0;x<G;x++){m2.fillStyle=cells[z*G+x]===T.OOB?'#000':'#fff';m2.fillRect(x,G-1-z,1,1);}
  const mask=new THREE.CanvasTexture(mcv);
  ground=new THREE.Mesh(drape(new THREE.PlaneGeometry(S,S,hgrid?hw-1:1,hgrid?hh-1:1)),new THREE.MeshLambertMaterial({map:grassTex,color:TINT,alphaMap:mask,transparent:true,alphaTest:.5}));
  ground.rotation.x=-Math.PI/2; scene.add(ground);
}

// misty base plane below the parcel so the silhouette sits in a haze-sea, not a black void
// (parity: match the module's fog colour so the horizon has no seam)
const hazeCol=parity&&scene.fog?scene.fog.color.getHex():(lava?0x2a120c:0x16243a);
const haze=new THREE.Mesh(new THREE.PlaneGeometry(S*4.5,S*4.5),new THREE.MeshBasicMaterial({color:hazeCol,transparent:true,opacity:.92}));
haze.rotation.x=-Math.PI/2; haze.position.y=-3.5; scene.add(haze);

// upscale + feather a G×G cell canvas so coastlines/roads read smooth instead of pixel-blocky.
// Canvas rows follow the active z convention (legacy mirrors, parity doesn't).
function soften(src,scale,blur){const o=document.createElement('canvas');o.width=o.height=src.width*scale;const g=o.getContext('2d');g.imageSmoothingEnabled=true;g.filter='blur('+blur+'px)';g.drawImage(src,0,0,o.width,o.height);g.filter='none';return o;}
function cellCanvas(pred,style){const cc=document.createElement('canvas');cc.width=cc.height=G;const g2=cc.getContext('2d');let any=false;for(let z=0;z<G;z++)for(let x=0;x<G;x++)if(pred(cells[z*G+x])){g2.fillStyle=style;g2.fillRect(x,ZS>0?z:G-1-z,1,1);any=true;}return any?cc:null;}
const TESS=hgrid?Math.min(200,(hw-1)*3):1;
function plane(tex,y,mat){tex.minFilter=tex.magFilter=THREE.LinearFilter;const m=new THREE.Mesh(drape(new THREE.PlaneGeometry(S,S,TESS,TESS),y),mat);m.material.map=tex;m.rotation.x=-Math.PI/2;if(!hgrid)m.position.y=y;scene.add(m);return m;}
// road (legacy only — parity gets baked road cells + lane ribbons from the module)
if(!parity){const cc=cellCanvas(c=>c===T.ROAD,THEMES?THEMES.road:'rgba(120,96,58,.9)');if(cc)plane(new THREE.CanvasTexture(soften(cc,4,3)),0.15,new THREE.MeshBasicMaterial({transparent:true,depthWrite:false}));}
// ESTATE SILHOUETTE (v19 owner 2026-08-01 "why are all maps square instead of the shape of the
// estate?"): the game-render module draws the full square arena; on polygon parcels the OOB cells
// (already in the data — arena.bounds IS the estate shape) mask to a dark haze overlay so the map
// reads as the estate's actual silhouette. Legacy path already alpha-masks its ground; this covers
// the parity/9-layer path. Renderer-only — the MOBA engine owes the same OOB honor (coord log).
// v20 (owner: "not sure what the black areas are"): a DIMMING VEIL, not a void — the terrain
// beyond the estate boundary reads through, darkened, so it's clearly "outside the estate".
if(parity&&a.arena&&a.arena.shape==="polygon"){
  const cc=cellCanvas(c=>c===T.OOB,'rgb(10,16,28)');
  if(cc)plane(new THREE.CanvasTexture(soften(cc,4,3)),0.55,new THREE.MeshBasicMaterial({transparent:true,depthWrite:false,opacity:0.55}));
}

// ---- WATER: flat waterline surface per basin (the module dips the heightfield; the surface must
// NOT drape into the dip — real water sits level inside the basin). Per connected water body:
// waterline = lowest shoreline bank − ε; depth-tinted vertex colours (shallow light → deep dark)
// with a near-white foam bake at the bank line; animated scrolling bump + specular glints.
// Modes from the manifest (biome.water): water | lava (emissive, slow) | ice (pale, glassy, still).
const waterMats=[];
(function buildWater(){
  const isW=(i,j)=>i>=0&&j>=0&&i<G&&j<G&&cells[j*G+i]===T.WATER;
  const seen=new Uint8Array(G*G);
  // multi-source BFS: distance (in cells) from every water cell to the nearest shore
  const dist=new Float32Array(G*G).fill(1e9); const bfs=[];
  for(let j=0;j<G;j++)for(let i=0;i<G;i++)if(isW(i,j)){
    if(isW(i-1,j)&&isW(i+1,j)&&isW(i,j-1)&&isW(i,j+1))continue;
    dist[j*G+i]=0;bfs.push(i,j);}
  for(let h=0;h<bfs.length;h+=2){const i=bfs[h],j=bfs[h+1],d=dist[j*G+i];
    for(const[di,dj]of[[1,0],[-1,0],[0,1],[0,-1]]){const ni=i+di,nj=j+dj;
      if(isW(ni,nj)&&dist[nj*G+ni]>d+1){dist[nj*G+ni]=d+1;bfs.push(ni,nj);}}}
  const mode=THEMES?"soda":((parity&&man.biome&&man.biome.water)||(lava?"lava":"water"));
  // tileable value-noise bump canvas (seeded — same ripples every load)
  const bcv=document.createElement('canvas');bcv.width=bcv.height=256;const bg=bcv.getContext('2d');
  const bi=bg.createImageData(256,256);let bs=(((a.meta&&a.meta.seed)>>>0)||7)^0x9e37;
  const brnd=()=>{bs=(bs+0x6D2B79F5)>>>0;let t=bs;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};
  const gsz=8,gv=[];for(let k=0;k<(gsz+1)*(gsz+1);k++)gv.push(brnd());
  for(let y=0;y<256;y++)for(let x=0;x<256;x++){
    const u=x/256*gsz,v=y/256*gsz,x0=u|0,y0=v|0,fx=u-x0,fy=v-y0,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
    const g00=gv[(y0%gsz)*(gsz+1)+(x0%gsz)],g10=gv[(y0%gsz)*(gsz+1)+((x0+1)%gsz)],g01=gv[((y0+1)%gsz)*(gsz+1)+(x0%gsz)],g11=gv[((y0+1)%gsz)*(gsz+1)+((x0+1)%gsz)];
    const n=(g00*(1-sx)+g10*sx)*(1-sy)+(g01*(1-sx)+g11*sx)*sy, q=(y*256+x)*4, b=(n*255)|0;
    bi.data[q]=b;bi.data[q+1]=b;bi.data[q+2]=b;bi.data[q+3]=255;}
  bg.putImageData(bi,0,0);
  const bumpTex=new THREE.CanvasTexture(bcv);bumpTex.wrapS=bumpTex.wrapT=THREE.RepeatWrapping;
  // wetland/swamp biomes get murky green-brown water (a bright shallow tint reads as ICE on the
  // big marsh bodies — owner feedback, Bastion estate)
  const wetl=parity&&man.biome&&man.biome.key==="wetland";
  const STYLE={
    water:wetl
      ?{color:0x3d5a3c,shallow:[0.46,0.55,0.40],deep:[0.10,0.17,0.10],op:0.92,shin:36,spec:0x46543e,em:0x0a120a,emI:0.22,bump:0.5,speed:0.5}
      :{color:0x2e6ea8,shallow:[0.55,0.72,0.85],deep:[0.10,0.26,0.44],op:0.9,shin:64,spec:0x5f83a8,em:0x06121e,emI:0.25,bump:0.38,speed:1},
    lava:{color:0xd8491c,shallow:[1.0,0.62,0.25],deep:[0.42,0.06,0.02],op:0.97,shin:6,spec:0x1a0a00,em:0xff5a1e,emI:0.8,bump:1.2,speed:0.25},
    ice:{color:0xbfdcea,shallow:[0.92,0.98,1.0],deep:[0.55,0.72,0.85],op:0.93,shin:170,spec:0xffffff,em:0x0a141c,emI:0.1,bump:0.15,speed:0},
    soda:THEMES?THEMES.water:{color:0xff7fb4,shallow:[1.0,0.78,0.88],deep:[0.85,0.30,0.55],op:0.9,shin:120,spec:0xffc0dd,em:0x33101f,emI:0.25,bump:0.3,speed:0.8}
  }[mode]||{color:0x2e6ea8,shallow:[0.62,0.80,0.92],deep:[0.10,0.26,0.44],op:0.88,shin:110,spec:0x9fc8ee,em:0x06121e,emI:0.25,bump:0.55,speed:1};
  // flood-fill components → one flat mesh each at its own waterline
  for(let j0=0;j0<G;j0++)for(let i0=0;i0<G;i0++){
    if(!isW(i0,j0)||seen[j0*G+i0])continue;
    const comp=[];const st=[i0,j0];seen[j0*G+i0]=1;
    while(st.length){const j=st.pop(),i=st.pop();comp.push(i,j);
      for(const[di,dj]of[[1,0],[-1,0],[0,1],[0,-1]]){const ni=i+di,nj=j+dj;
        if(isW(ni,nj)&&!seen[nj*G+ni]){seen[nj*G+ni]=1;st.push(ni,nj);}}}
    // tiny all-shore bodies (max shore-distance < 1.5 cells) skip the bright shallow ramp — they
    // otherwise read as white glare; a flat mid-depth tint reads as a pond
    let maxD=0;
    for(let h=0;h<comp.length;h+=2){const d=dist[comp[h+1]*G+comp[h]];if(d<1e8&&d>maxD)maxD=d;}
    const tiny=maxD<1.5;
    // waterline: lowest adjacent BANK top (ground height at the shore cells just outside)
    let bank=1e9;
    for(let h=0;h<comp.length;h+=2){const i=comp[h],j=comp[h+1];
      for(const[di,dj]of[[1,0],[-1,0],[0,1],[0,-1]]){const ni=i+di,nj=j+dj;

      }
      // ---- drum towers punctuate every ~26u of curtain run (§3a) ----
      // TWO-PART TOWER (owner 2026-07-21: "u can walk in between through the tower… build the wall
      // first, that u can walk on with guard rails, then build the hut with opening on top"): the
      // WALL-WALK RUNS THROUGH every tower. Part 1 = solid base drum up to walk level (H). Part 2 =
      // the turret HUT floating above an open walk-through band: two jamb walls on the inner/outer
      // faces carry it, the two along-wall faces stay OPEN as doorways for the walk.
      const before=Math.floor(run/26);run+=L;
      if(Math.floor(run/26)>before&&!nearGate(p[0],p[1],9)&&!nearStairTop(p[0],p[1],9)){
        const dxa2=(q[0]-p[0]),dza2=(q[1]-p[1]),dl2=Math.hypot(dxa2,dza2)||1;
        let tnx=-dza2/dl2,tnz=dxa2/dl2;                       // across-wall normal at this tower
        if(tnx*(p[0]-cx)+tnz*(p[1]-cz)<0){tnx=-tnx;tnz=-tnz;}
        const twAng=Math.atan2(-ZS*dza2,dxa2);
        const base=new THREE.Group();                          // PART 1: base drum → walk level
        base.add(new THREE.Mesh(new THREE.CylinderGeometry(4.7,5.4,H,10),wallM));
        putC(base,p[0],p[1],H/2);
        const OPEN=3.1;                                        // doorway band height above the walk
        for(const sj of [1,-1]){                               // jambs on the inner+outer faces only
          const j=putC(new THREE.Mesh(new THREE.BoxGeometry(7.6,OPEN,1.3),wallM),
            p[0]+tnx*sj*3.4,p[1]+tnz*sj*3.4,H+OPEN/2);j.rotation.y=twAng;}
        const hut=new THREE.Group();                           // PART 2: the turret hut above
        hut.add(new THREE.Mesh(new THREE.CylinderGeometry(4.5,4.9,3.6,10),wallM));
        const crown=new THREE.Mesh(new THREE.CylinderGeometry(5.4,5.4,1.6,10),wallM);crown.position.y=2.4;hut.add(crown);
        const roof=new THREE.Mesh(new THREE.ConeGeometry(5.0,5.5,10),roofM);roof.position.y=5.7;hut.add(roof);
        putC(hut,p[0],p[1],H+OPEN+1.8);}
    }
    // ---- CORNER POSTS at every ring anchor (owner 2026-07-28: "outer wall got gaps" / "gaps
    // between wall and tower"): wall boxes only overhang 0.6u past each anchor, so sharp bends
    // (enclosure dents) opened visible slits at the joints. A small drum at each anchor seals
    // every wall↔wall and wall↔tower miter; gate anchors are framed by the gatehouse instead. ----
    for(const p of pts){
      if(nearGate(p[0],p[1],6.5))continue;
      // v18: fatter posts (3.4/3.8 ≥ the 2.1u wall half-thickness at any miter angle) and NEAR-FLUSH
      // height — a stair top may land beside a post and the walk stays continuous over it.
      const post=putC(new THREE.Mesh(new THREE.CylinderGeometry(3.4,3.8,H+0.4,8),wallM),p[0],p[1],(H+0.4)/2);
      const cap=putC(new THREE.Mesh(new THREE.CylinderGeometry(3.8,3.8,0.7,8),trimM),p[0],p[1],H+0.6);
    }
    // ---- gatehouses: twin towers + recessed arch + portcullis glow (§3a) ----
    for(const g of ring.gates||[]){
      const [gx,gz]=g.at;
      let bx=0,bz=0;for(let i2=0;i2<pts.length;i2++){const p2=pts[i2],q2=pts[(i2+1)%pts.length];
        if(Math.hypot((p2[0]+q2[0])/2-gx,(p2[1]+q2[1])/2-gz)<9){bx=q2[0]-p2[0];bz=q2[1]-p2[1];break;}}
      const gl=Math.hypot(bx,ZS*bz)||1,ang=Math.atan2(-ZS*bz/gl*gl,bx);
      const off=7.2,ox=(bx/ (Math.hypot(bx,bz)||1))*off,oz=(bz/(Math.hypot(bx,bz)||1))*off;
      for(const s2 of [-1,1]){const tw=new THREE.Group();
        tw.add(new THREE.Mesh(new THREE.CylinderGeometry(3.4,4.0,H*1.55,9),wallM));
        const roof=new THREE.Mesh(new THREE.ConeGeometry(3.9,4.4,9),roofM);roof.position.y=H*0.78+2.2;tw.add(roof);
        putC(tw,gx+s2*ox,gz+s2*oz,H*0.78);}
      // OPEN passage: a lintel spans ABOVE head height and the portcullis grate hangs half-raised
      // in the upper band — the road walks straight through (the DOOR itself = the castle_gate_N
      // structure's HP: attackers batter it down; visuals stay open-arch so the entrance READS).
      // v22 hero-scale (owner 2026-08-02 "walls too small to fit a hero underneath — no ducking"):
      // the arch's clear opening is 0.65×H (matches siege.wallRing.archClearH).
      const arch=putC(new THREE.Mesh(new THREE.BoxGeometry(off*2-4,H*0.4,3.4),wallM),gx,gz,H*0.85);arch.rotation.y=ang;
      const port=putC(new THREE.Mesh(new THREE.BoxGeometry(off*2-8.5,H*0.28,0.5),
        new THREE.MeshLambertMaterial({color:0x181a1f,emissive:0x2a2416,flatShading:true})),gx,gz,H*0.79);port.rotation.y=ang;
      // OPEN WOODEN GATES (owner 2026-07-28: "show them with the OPEN wooden gates for the actual
      // attackable entrances" — supersedes the closed leaf of 07-25): the destructible castle_gate_N
      // (material:WOOD, hpMax, states CLOSED/OPEN/BROKEN) renders in the designer as TWO timber
      // leaves swung ~66° into the courtyard from the jambs — the archway visibly stands open, so
      // every attackable entrance reads at a glance. CLOSED/BROKEN remain runtime states in-engine.
      const uL=Math.hypot(bx,bz)||1,uxw=bx/uL,uzw=bz/uL;         // wall tangent at the gate
      let inx=-uzw,inz=uxw;if(inx*(cx-gx)+inz*(cz-gz)<0){inx=-inx;inz=-inz;}
      const DW=off*2-9,DH=H*0.62,LEAF=DW/2,openA=1.15;
      const woodM=new THREE.MeshLambertMaterial({color:0x6b4a2b,flatShading:true});
      const ironM=new THREE.MeshLambertMaterial({color:0x2b2620,flatShading:true});
      for(const sgn of [1,-1]){
        const hx=gx+uxw*sgn*(DW/2),hz=gz+uzw*sgn*(DW/2);         // hinge at the jamb
        const ca=Math.cos(openA),sa=Math.sin(openA);             // leaf swings from "toward center" into the courtyard
        const ldx=(-uxw*sgn)*ca+inx*sa, ldz=(-uzw*sgn)*ca+inz*sa;
        const ll=Math.hypot(ldx,ldz)||1;
        const lcx=hx+(ldx/ll)*(LEAF/2), lcz=hz+(ldz/ll)*(LEAF/2);
        const leaf=putC(new THREE.Mesh(new THREE.BoxGeometry(LEAF,DH,0.9),woodM),lcx,lcz,DH/2);
        leaf.rotation.y=Math.atan2(-ZS*ldz,ldx);
        for(const yb of [DH*0.28,DH*0.72]){                      // iron straps across the planks
          const band=putC(new THREE.Mesh(new THREE.BoxGeometry(LEAF+0.2,0.55,1.05),ironM),lcx,lcz,yb);
          band.rotation.y=leaf.rotation.y;}
      }
    }
    // ---- STAIRS FROM DATA (v18, owner 2026-08-01: "we only spec two types of stairs —
    // perpendicular to the inner wall onto the wall top, or along the inner side of the wall
    // ending at a walkable part of the wall or a tower"). Every flight comes VERBATIM from
    // ring.stairs (generator computeStairs): wall clearance, in-ward feet, tower avoidance and
    // ward-gap run caps are all guaranteed at the DATA layer, so the kit only extrudes each
    // foot→top line as rising treads. No renderer-side stair derivation remains (the spiral and
    // the per-gate parallel/perpendicular builders are retired — that drift class is gone). ----
    for(const s of ring.stairs||[]){
      const [fx,fz]=s.foot;let [tx,tz]=s.top;
      // v20 (owner 2026-08-01 "stairs need to touch the wall to be able to walk on it"): the last
      // tread centered short of `top` left a ~0.6u air gap at the wall face — extend the drawn
      // flight 1u past the data top so the highest tread lands INTO the wall/tower body, flush.
      {const ddx=tx-fx,ddz=tz-fz,dL=Math.hypot(ddx,ddz)||1;tx+=ddx/dL*1.0;tz+=ddz/dL*1.0;}
      const dxs=tx-fx,dzs=tz-fz,Ls=Math.hypot(dxs,dzs)||1;
      const aS=Math.atan2(-ZS*dzs,dxs);
      const nSt=Math.max(5,Math.min(12,Math.round(H/1.5)));
      const tread=Ls/nSt;
      for(let st=0;st<nSt;st++){
        const t=(st+0.5)/nSt, hh=H*(st+1)/nSt;
        const step=putC(new THREE.Mesh(new THREE.BoxGeometry(tread+0.12,hh,3.4),wallM),fx+dxs*t,fz+dzs*t,hh/2);
        step.rotation.y=aS;
      }
    }
  }
  // ---- the KEEP: tiers climb, corner turrets, roof + banner — the silhouette (§1 rule 3) ----
  if(CG.keep){const K=CG.keep,tiers=Math.max(1,K.tiers|0),tierH=K.h/tiers;let w2=K.w||16,y2=0;
    const kl=K.lift||0, putK=(m,x,z,y)=>putC(m,x,z,kl+y);   // keep crowns the innermost ward
    for(let t2=0;t2<tiers;t2++){
      putK(new THREE.Mesh(new THREE.BoxGeometry(w2,tierH,w2),wallM),K.at[0],K.at[1],y2+tierH/2);
      if(t2===tiers-1)for(const [sx,sz] of [[-1,-1],[-1,1],[1,-1],[1,1]]){
        const tur=new THREE.Group();
        tur.add(new THREE.Mesh(new THREE.CylinderGeometry(1.7,2.0,5,8),wallM));
        const tr=new THREE.Mesh(new THREE.ConeGeometry(2.1,2.8,8),roofM);tr.position.y=3.6;tur.add(tr);
        putK(tur,K.at[0]+sx*w2*0.46,K.at[1]+sz*w2*0.46,y2+tierH);}
      y2+=tierH;w2*=0.74;}
    const kr=new THREE.Mesh(new THREE.ConeGeometry(w2*0.9,6,4),roofM);putK(kr,K.at[0],K.at[1],y2+3);kr.rotation.y=Math.PI/4;
    putK(new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,7,5),wallM),K.at[0],K.at[1],y2+8);
    const flag=putK(new THREE.Mesh(new THREE.PlaneGeometry(4.4,2.6),bannerM),K.at[0]+2.2,K.at[1],y2+10.4);flag.rotation.y=ZS>0?0:Math.PI;}
  // ---- moat ring (drowned_bastion): a water annulus hugging the outer wall (§2) ----
  if(CG.moat){const mo=new THREE.Mesh(new THREE.RingGeometry(rAvg*1.12,rAvg*1.38,40),
    new THREE.MeshPhongMaterial({color:0x18384a,shininess:80,specular:0x557799,transparent:true,opacity:0.85}));
    mo.rotation.x=-Math.PI/2;const w3=world(cx,cz);mo.position.set(w3.x,baseY+0.5,w3.z);scene.add(mo);}
})();
for(const mb of a.mobs||[]){const c=new THREE.Mesh(new THREE.TetrahedronGeometry(3.4),new THREE.MeshLambertMaterial({color:0xc04ac0,emissive:0x501050}));put(c,mb.x,mb.z,2.4);}
for(const b of a.buildSpots||[]){const pad=new THREE.Mesh(new THREE.CylinderGeometry(b.size*0.6,b.size*0.6,0.4,12),lam(0x3a4152));put(pad,b.x,b.z,0.25);}
// destructible HP-gates: a low breachable wall spanning the cells it opens, colored by kind
const GATE={FOREST_WALL:0x6b4a2a,BOULDER_PILE:0x6e6a63,PORTCULLIS:0x8a7c4a,ICE_WALL:0x9fd0e6};
for(const b of a.barriers||[]){const bcells=b.opens||[[b.x,b.z]];const w=Math.max(4,Math.hypot(bcells[bcells.length-1][0]-bcells[0][0],bcells[bcells.length-1][1]-bcells[0][1])+CELL*2);
  const horiz=Math.abs(bcells[bcells.length-1][0]-bcells[0][0])>=Math.abs(bcells[bcells.length-1][1]-bcells[0][1]);
  const wall=new THREE.Mesh(new THREE.BoxGeometry(horiz?w:CELL*1.4,3.2,horiz?CELL*1.4:w),new THREE.MeshLambertMaterial({color:GATE[b.kind]||0x7a6a4a,emissive:b.kind==="ICE_WALL"?0x224455:0x000000,flatShading:true}));put(wall,b.x,b.z,1.6);}
// spawn rings (both modes: side markers are design QA, the module's fountain pads are canBase only)
// FLOATING BEACONS (owner 2026-07-18: a legend marker must be a ring/pillar that rides ABOVE the
// ground and bobs, so land elevation never hides it). Per spawn: a faint anchor pillar (depth-
// tested, reads as grounded) + a bright ring that hovers ~13u up, bobs, and renders ON TOP
// (depthTest off) so it's visible through any hill. beaconBob() animates them in the loop.
const beacons=[];
for(const s of a.spawnZones||[]){
  // ANY = an EDGE ENTRY: where an attacking army walks in AND where marching reinforcements
  // arrive (decision 11 — arrival edge matches approach direction). Teal, smaller — a doorway
  // marker, not a base. Floating like every other beacon (owner 2026-07-21).
  const col=s.side==="ATTACKER"?0xe25a50:(s.side==="OBJECTIVE"?0xffd34d:(s.side==="ANY"?0x58d6c9:0x5a8ee2));
  const grp=new THREE.Group();
  const pil=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,15,7),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.26,depthWrite:false}));
  pil.position.y=7.5;grp.add(pil);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(s.side==="ANY"?4.2:6.5,0.7,8,28),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.96,depthWrite:false,depthTest:false}));
  ring.rotation.x=Math.PI/2;ring.position.y=13;ring.renderOrder=6;grp.add(ring);
  const bob=new THREE.Mesh(new THREE.SphereGeometry(0.8,10,8),new THREE.MeshBasicMaterial({color:col,depthTest:false}));bob.renderOrder=6;bob.position.y=13;grp.add(bob);
  put(grp,s.x,s.z,0);
  beacons.push({ring,bob,base:13,ph:(s.x+s.z)});}
function beaconBob(t){for(const b of beacons){const y=b.base+Math.sin(t*1.8+b.ph)*1.4;b.ring.position.y=y;b.bob.position.y=y;b.ring.rotation.z=t*0.6;}}
// dotted lanes (legacy only — parity gets the worn Catmull-Rom ribbons, layer 6)
if(!parity)for(const lane of a.lanes||[])for(let i=0;i<lane.length-1;i++){const [ax,az]=lane[i],[bx,bz]=lane[i+1];
  const steps=Math.max(2,Math.round(Math.hypot(bx-ax,bz-az)/8));
  for(let s=0;s<=steps;s+=2){const dot=new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.9,0.3,6),new THREE.MeshBasicMaterial({color:0xd2be8c}));put(dot,ax+(bx-ax)*s/steps,az+(bz-az)*s/steps,0.35);}}

// raw-cells QA toggle: legacy swaps the ground texture; parity overlays a translucent cell plane
let raw=false,rawMesh=null;
document.getElementById("texBtn").textContent=parity?"🔍 cells":"🎨 grass";
document.getElementById("texBtn").onclick=()=>{raw=!raw;
  const mkRaw=()=>{const cc=document.createElement('canvas');cc.width=cc.height=G;const g2=cc.getContext('2d');
    const C=[[86,118,72],[38,72,40],[110,106,98],[52,86,120],[90,82,74],[150,132,96]];
    for(let z=0;z<G;z++)for(let x=0;x<G;x++){const c=cells[z*G+x];if(c===T.OOB)continue;const q=C[Math.min(c,5)];g2.fillStyle=`rgb(${q[0]},${q[1]},${q[2]})`;g2.fillRect(x,ZS>0?z:G-1-z,1,1);}
    const tx=new THREE.CanvasTexture(cc);tx.magFilter=THREE.NearestFilter;return tx;};
  if(parity){
    if(raw&&!rawMesh){rawMesh=plane(mkRaw(),0.6,new THREE.MeshBasicMaterial({transparent:true,opacity:.78,depthWrite:false}));rawMesh.renderOrder=2;}
    else if(rawMesh){rawMesh.visible=raw;}
    document.getElementById("texBtn").textContent=raw?"🔍 game":"🔍 cells";
  }else{
    if(raw){ground.material.map=mkRaw();ground.material.color.set(0xffffff);}
    else{ground.material.map=grassTex;ground.material.color.setHex(TINT);}
    ground.material.needsUpdate=true;document.getElementById("texBtn").textContent=raw?"🎨 cells":"🎨 grass";
  }};

// ---- TRAVERSABILITY AUDIT overlays (owner 2026-08-01: "show me an NPC traversable audit …
// collision boxes … pathfinding — can walk on stairs over to the wall, through gates, not through
// walls"). Two toggles, one server-computed audit (/designs/:id/traverse.json — 100 seeded
// headless walks over the artifact's walk model with castle walls solid + arches open):
//   ⛔ collision — red translucent field over every cell an agent can NOT stand on (incl. walls)
//   🧭 paths     — the walk trails: green = traversed, red = UNREACHABLE (audit failures);
//                  cyan loops = the wall-walk network at parapet height; gold = stair links
//                  ground↔parapet (red stair link = its foot is cut off from the courtyard).
let audit=null,colMesh=null,pathGrp=null;
async function loadAudit(){
  if(audit)return audit;
  try{audit=await fetch(`/internal/v1/designs/${encodeURIComponent(pid)}/traverse.json`).then(r=>r.ok?r.json():null);}catch(e){}
  return audit;
}
const yAt=(x,z,lift)=>((typeof hAt==="function"?(hAt(x,z)||0):0))+(lift||0);
document.getElementById("colBtn").onclick=async()=>{
  const au=await loadAudit();if(!au){document.getElementById("colBtn").textContent="⛔ n/a";return;}
  if(colMesh){colMesh.visible=!colMesh.visible;document.getElementById("colBtn").style.opacity=colMesh.visible?1:.5;return;}
  const Gg=au.grid.w,bl=Uint8Array.from(atob(au.grid.blocked),c=>c.charCodeAt(0));
  const cc=document.createElement('canvas');cc.width=cc.height=Gg;const g2=cc.getContext('2d');
  for(let z=0;z<Gg;z++)for(let x=0;x<Gg;x++)if(bl[z*Gg+x]){g2.fillStyle='rgba(255,64,64,0.85)';g2.fillRect(x,ZS>0?z:Gg-1-z,1,1);}
  colMesh=plane(new THREE.CanvasTexture(cc),1.1,new THREE.MeshBasicMaterial({transparent:true,opacity:.5,depthWrite:false}));
  colMesh.renderOrder=6;document.getElementById("colBtn").style.opacity=1;
};
document.getElementById("pathBtn").onclick=async()=>{
  const au=await loadAudit();if(!au){document.getElementById("pathBtn").textContent="🧭 n/a";return;}
  if(pathGrp){pathGrp.visible=!pathGrp.visible;document.getElementById("pathBtn").style.opacity=pathGrp.visible?1:.5;return;}
  pathGrp=new THREE.Group();
  const mkLine=(pts3,color,op)=>{const geo=new THREE.BufferGeometry().setFromPoints(pts3.map(p=>new THREE.Vector3(p[0],p[1],p[2])));
    const ln=new THREE.Line(geo,new THREE.LineBasicMaterial({color,transparent:true,opacity:op??.75,depthWrite:false}));pathGrp.add(ln);return ln;};
  const w3=(x,z,y)=>{const w=world(x,z);return [w.x,y,w.z];};
  for(const t of au.trails||[]){
    if(t.ok&&t.wp)mkLine(t.wp.map(([x,z])=>w3(x,z,yAt(x,z)+1.0)),0x39d353,.55);
    else{ // failed walk: a red dashed-look straight indicator from→to so the failure is visible
      mkLine([w3(t.from[0],t.from[1],yAt(t.from[0],t.from[1])+1.6),w3(t.to[0],t.to[1],yAt(t.to[0],t.to[1])+1.6)],0xff4040,.9);
      const mk=new THREE.Mesh(new THREE.SphereGeometry(1.6,8,6),new THREE.MeshBasicMaterial({color:0xff4040}));
      const pw=w3(t.to[0],t.to[1],yAt(t.to[0],t.to[1])+1.6);mk.position.set(pw[0],pw[1],pw[2]);pathGrp.add(mk);
    }
  }
  for(const wn of au.wallNet||[]){
    const loop=[...wn.pts,wn.pts[0]];
    mkLine(loop.map(([x,z])=>w3(x,z,yAt(x,z)+wn.h+0.8)),0x35d0e0,.9);
  }
  for(const s of au.stairLinks||[]){
    mkLine([w3(s.foot[0],s.foot[1],yAt(s.foot[0],s.foot[1])+0.6),w3(s.top[0],s.top[1],yAt(s.top[0],s.top[1])+s.h+0.6)],s.ok?0xf5c542:0xff4040,.95);
  }
  scene.add(pathGrp);document.getElementById("pathBtn").style.opacity=1;
  const st=au.stats||{};document.getElementById("pathBtn").textContent=`🧭 ${st.reached??"?"}/${st.walks??"?"}·⇑${st.stairsOk??"?"}/${st.stairs??"?"}`;
};

// HUD
let ver=null; try{ ver=await fetch("/internal/v1/version").then(r=>r.ok?r.json():null); }catch(e){}
const bud=d.budget||{},row=d.row||{};
document.getElementById("hud").innerHTML=`<b>${pid}</b> · v${a.meta?.designVersion??row.designVersion??"?"} · ${row.status||""}<div class="chips">`+
 [p.archetype,p.palette,p.landmark!=="NONE"?p.landmark:null,(a.laneCount||1)+" lane(s)",
  (a.resources||[]).length+" nodes",(a.mobs||[]).length+" camps",(a.structures||[]).length+" towers",
  (a.barriers||[]).length?((a.barriers).length+" gates"):null,(a.meta?.modes||[]).join("/")||null,
  parity?"🎬 game render (9-layer)":hgrid?"⛰ heightfield":"▱ flat (no manifest)",man?.biome?.key?("🌿 "+man.biome.key):null,
  bud.name?("🏦 "+bud.name):null,
  ver?("🏗 "+ver.build+" · g"+ver.genVersion+(ver.dataRoot==="MISSING"?" · ⚠ NO WORLD DATA":"")):null,
  a.meta?.genVersion!=null?("map g"+a.meta.genVersion):null].filter(Boolean).map(x=>`<span>${x}</span>`).join("")+`</div>`;
document.querySelector("#hint").lastChild.textContent=parity
 ?"drag = orbit · wheel = zoom · right-drag = pan · THE game render (EF_BATTLEFIELD — what hero mode shows)"
 :"drag = orbit · wheel = zoom · right-drag = pan · fallback render (no manifest — run the converter for the game look)";

addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
// PREVIEW-ONLY camera-adaptive fog: the module's TUNED fog (175/310) is calibrated for the game's
// close camera. At/below that distance the exact numbers apply; orbiting further out scales the
// range proportionally so the designer can still see the whole map with the same relative haze.
const fogBase=parity&&scene.fog?{near:scene.fog.near,far:scene.fog.far,dist:220}:null;
let _clock=0;
(function loop(){requestAnimationFrame(loop);ctl.update();_clock+=1/60;beaconBob(_clock);
  if(fogBase){const k=Math.max(1,cam.position.distanceTo(ctl.target)/fogBase.dist);scene.fog.near=fogBase.near*k;scene.fog.far=fogBase.far*k;}
  if(waterMats.length&&waterMats[0].speed){const t=waterMats[0].mat.bumpMap;t.offset.x+=0.00022*waterMats[0].speed;t.offset.y+=0.00013*waterMats[0].speed;} // shared bump texture — scroll once
  if(bf&&bf.update)bf.update(1/60);ren.render(scene,cam);})();
})();
