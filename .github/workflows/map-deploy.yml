name: Deploy map service (map.etherfantasy.com)

# The CF map service (map-service/server.js): all-maps gallery + designer + registry API. Runs on the
# SAME self-hosted runner (label: cf) as the live game, but as a SEPARATE pm2 app `ef-map-service` on
# :8150 in ~/ef-map-service — restarting it never touches `clashfront` (:8130), cfx (:8131), or
# cf-battle-api (:8140). nginx proxy_pass map.etherfantasy.com → :8150 (see map-service/DEPLOY.md). No
# ssh/scp: the CF runner already lives on the box (replaces the old deploy key). Push to deploy/map
# (or dispatch) to ship.

on:
  push:
    branches: [deploy/map]
    paths:
      - 'map-service/**'
      - 'deploy/remote-deploy-map.sh'
      - '.github/workflows/map-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: map-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, cf]
    steps:
      - uses: actions/checkout@v4

      - name: Sync map-service → ~/ef-map-service (registry stays in ~/ef-battlefields, untouched)
        run: |
          mkdir -p "$HOME/ef-map-service"
          rsync -a --delete --exclude='.git' \
            "$GITHUB_WORKSPACE"/map-service/ "$HOME"/ef-map-service/

      # Client obfuscation (owner 2026-08-06: "take the same obfuse engine to cover the map") —
      # the MOBA repo's javascript-obfuscator profile, run IN PLACE over the deployed mirror.
      # SOURCE stays readable in the repo; the box serves hardened copies. The script exits
      # non-zero on a stub build or any file left readable, which FAILS the deploy — a silent
      # fallback to raw is the failure that matters (same doctrine as the MOBA pipeline).
      - name: Obfuscate served client JS/HTML (MOBA obfuse engine)
        run: |
          cd "$GITHUB_WORKSPACE/map-service/build"
          npm install --no-audit --no-fund
          DOMAIN_LOCK="" node obfuscate.mjs --dir "$HOME/ef-map-service"

      # worldfield's dataRoot() probes ~/ef-map-service/data on the box. WITHOUT these files the
      # service silently falls back to /api/world and loses zone/bbox/palette coherence.
      - name: Ship world data + build stamp
        run: |
          mkdir -p "$HOME/ef-map-service/data/hexagon-city-source"
          rsync -a --delete "$GITHUB_WORKSPACE"/data/hexagon-city-source/l3/ "$HOME"/ef-map-service/data/hexagon-city-source/l3/
          rsync -a --delete "$GITHUB_WORKSPACE"/data/world-terrain/  "$HOME"/ef-map-service/data/world-terrain/
          rsync -a --delete "$GITHUB_WORKSPACE"/data/world-elements/ "$HOME"/ef-map-service/data/world-elements/
          cp "$GITHUB_WORKSPACE"/data/zone-registry.json "$HOME"/ef-map-service/data/
          # L2 estate table (mint explorer's estate list) + land-mint contract registry — both read
          # via dataRoot(); without them /internal/v1/unminted?collection=estates returns total:0 and
          # the distributor/claim addresses are null.
          cp "$GITHUB_WORKSPACE"/data/hexagon-city-source/parcels-l2.json "$HOME"/ef-map-service/data/hexagon-city-source/
          cp "$GITHUB_WORKSPACE"/data/land-contracts.json "$HOME"/ef-map-service/data/
          # committed MOBA maps (siege-test etc.) — served at /internal/v1/moba-map/<name> so the MOBA
          # staging FETCHES the authoritative current map instead of drifting to a stale hand-copy.
          rsync -a --delete "$GITHUB_WORKSPACE"/data/moba-maps/ "$HOME"/ef-map-service/data/moba-maps/
          # pre-designed ESTATE PALACE artifacts (7-digit estate ids) — the designs route serves them
          # read-only so every PALACE in the castle explorer opens in 3D (canon decision 5).
          mkdir -p "$HOME/ef-map-service/data/cf-maps/artifacts" "$HOME/ef-map-service/data/cf-maps/manifests"
          cp "$GITHUB_WORKSPACE"/data/cf-maps/artifacts/*.artifact.json "$HOME"/ef-map-service/data/cf-maps/artifacts/
          cp "$GITHUB_WORKSPACE"/data/cf-maps/manifests/*.manifest.json "$HOME"/ef-map-service/data/cf-maps/manifests/ 2>/dev/null || true
          # 🕹→📱 Clash Lands AR terrains (glb/json/height.png/manifest) served at /clash-lands/terrains/
          mkdir -p "$HOME/ef-map-service/data/cf-maps/ar-terrains"
          cp "$GITHUB_WORKSPACE"/data/cf-maps/ar-terrains/* "$HOME"/ef-map-service/data/cf-maps/ar-terrains/ 2>/dev/null || true
          # AERIAL 3D-THUMB MOSAIC — the committed baked continents (~0.3 MB each; raw thumbs are
          # box-side/gitignored). /internal/v1/mosaic serves these when the box has no thumbs, so
          # /designer shows real 3D thumbs immediately. A box capture (below) overrides with a fresh bake.
          mkdir -p "$HOME/ef-map-service/data/cf-maps/world-mosaic"
          cp "$GITHUB_WORKSPACE"/data/cf-maps/world-mosaic/*.png "$HOME"/ef-map-service/data/cf-maps/world-mosaic/ 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/data/cf-maps/world-mosaic/*.json "$HOME"/ef-map-service/data/cf-maps/world-mosaic/ 2>/dev/null || true
          # LOD per-parcel thumbs (128px, committed subset) — the crisp zoom-in detail layer.
          rsync -a --delete "$GITHUB_WORKSPACE"/data/cf-maps/thumbs3d-lod/ "$HOME"/ef-map-service/data/cf-maps/thumbs3d-lod/ 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD > "$HOME"/ef-map-service/BUILD
          # ── CLOSE THE MOBA MAP LAST-MILE (owner 2026-08-29: "why are we back at the same stale-map
          # issue again?"). Root cause: the MOBA staging game VENDORS data/moba-maps/*.json in its own
          # client dir (CLIENT_FILES.staging.txt) and can't fetch the map service (CORS/egress). The
          # auto-sync mirrors to the engine repo but the live box is updated by a MANUAL deploy_client.sh
          # + an unmerged review branch → drift. The CF `cf` runner ALREADY lives on this game box, so
          # copy the authoritative fresh maps straight into every game serving dir that exists — no
          # manual deploy, no repo merge, no CORS. Guarded (only dirs that exist) + non-fatal.
          for G in "$HOME/ef-moba-game" "$HOME/ef-moba-game-staging" "$HOME/ef-moba-staging" \
                   "$HOME/ef-moba/staging" "$HOME/ef-moba" "$HOME/game" "$HOME/game-staging"; do
            if [ -d "$G/data/moba-maps" ]; then
              rsync -a "$GITHUB_WORKSPACE"/data/moba-maps/ "$G"/data/moba-maps/ && echo "delivered MOBA maps → $G/data/moba-maps"
            fi
          done

      - name: (re)start ef-map-service on :8150 (health-gated on /healthz)
        run: |
          # single source of deploy truth = the checked-out script, pointed at the synced app dir.
          # :8140 is cf-battle-api on the box — the map service binds :8150.
          MAPS_APP_DIR="$HOME/ef-map-service" MAPS_PORT=8150 \
          bash "$GITHUB_WORKSPACE"/deploy/remote-deploy-map.sh

      # BEST-EFFORT 3D-THUMB CAPTURE ON THE BOX (owner 2026-08-25 "run the capture on the box").
      # Headless top-down capture of every designed parcel → data/cf-maps/thumbs3d, then a fresh
      # mosaic bake that overrides the committed one. Fully NON-FATAL: if the box has no Chromium the
      # step self-skips and the shipped committed mosaic keeps serving real thumbs. Never fails deploy.
      - name: Capture 3D thumbs + re-bake mosaic (non-fatal; needs Chromium)
        continue-on-error: true
        run: |
          set +e
          APP="$HOME/ef-map-service"
          # locate a Chromium the way the capture tool expects (PW_CHROME override or common paths)
          CH="${PW_CHROME:-}"
          for c in "$CH" /opt/pw-browsers/chromium "$(command -v chromium 2>/dev/null)" "$(command -v chromium-browser 2>/dev/null)" "$(command -v google-chrome 2>/dev/null)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then CH="$c"; break; fi
          done
          if [ -z "$CH" ]; then echo "no Chromium on box — skipping capture; committed mosaic stays live."; exit 0; fi
          cd "$APP" || exit 0
          npm install --no-audit --no-fund playwright-core >/dev/null 2>&1 || { echo "playwright-core install failed — skip"; exit 0; }
          # capture every designed parcel the running service reports, then warm each zone's mosaic.
          PW_CHROME="$CH" MAPS_BASE="http://127.0.0.1:8150" \
            node tools/capture_thumb.mjs --from-service --concurrency 4 --settle 1500 || echo "capture had errors (non-fatal)"
          # force a fresh bake so /designer serves the box's own thumbs (overrides committed)
          for Z in EDU; do curl -s -o /dev/null "http://127.0.0.1:8150/internal/v1/mosaic.png?zone=$Z&force=1" || true; done
          echo "box capture step done."
