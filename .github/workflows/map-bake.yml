name: Bake zone defaults (server registry)

# Runs the default-design bake ON THE BOX (the cf runner lives there) into the LIVE registry
# ~/ef-battlefields — the baked maps are server-state only, never committed to git (owner
# 2026-07-21: "map should be directly placed on the server… a living adjustment directly on
# server"). This workflow is only the remote-control button: sandbox sessions have no SSH, the
# runner is the one hand we have on the box. Idempotent + resumable (bake-zone.mjs skips
# already-seeded parcels at the current GEN_VERSION), so re-dispatching only fills gaps.
#
# 2026-10-26 ZERO-DOWNTIME SHAPE (docs/maps/MAP-POPULATION-GUIDE.md §4): the bake writes into
# its own SHARD registry (~/ef-battlefields-bake) while the service keeps serving; only the
# MERGE needs the service stopped (single-writer rule for index.json) and it takes seconds —
# parcel dirs are renamed, the index is unioned once. Owner work in the live registry always wins.
# A census runs before and after so the run log IS the completeness report.

on:
  workflow_dispatch:
    inputs:
      zones:
        description: "Zones to bake, space-separated, or ALL (= every charted zone, biggest first)"
        required: true
        default: "ALL"
      estates:
        description: "Also bake whole-estate maps for un-subdivided estates (EPIC→SMALL, the biggest maps first)"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"
      estates_only:
        description: "Only the estate maps (skip the L3 parcel pass)"
        required: true
        type: choice
        options: ["false", "true"]
        default: "false"
      limit:
        description: "Optional per-zone cap (validation runs); empty = all"
        required: false
        default: ""

concurrency:
  group: map-bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: [self-hosted, cf]
    steps:
      - uses: actions/checkout@v4

      - name: Census BEFORE (read-only)
        run: |
          cd "$GITHUB_WORKSPACE/map-service"
          df -h "$HOME" | tail -1
          MAPS_DIR="$HOME/ef-battlefields" node scripts/registry-census.mjs || true

      - name: Bake into the SHARD registry (service keeps running)
        run: |
          cd "$GITHUB_WORKSPACE/map-service"
          LIMIT="${{ inputs.limit }}"
          EST=""; [ "${{ inputs.estates }}" = "true" ] && EST="--estates"
          [ "${{ inputs.estates_only }}" = "true" ] && EST="--estates-only"
          # 2026-10-26: the first BUS run was OOM-killed at 63k rows (exit 137) — index rows are slim now
          # and the flush cadence is 2000 (each flush stringifies the whole shard index). Progress logs rss.
          MAPS_DIR="$HOME/ef-battlefields-bake" node scripts/bake-zone.mjs ${{ inputs.zones }} $EST ${LIMIT:+--limit=$LIMIT} --every=1000 --flush=2000

      - name: Merge shard → live (service stopped for seconds) + purge orphan rows
        run: |
          cd "$GITHUB_WORKSPACE/map-service"
          pm2 stop ef-map-service || true
          node scripts/merge-registry.mjs "$HOME/ef-battlefields-bake" "$HOME/ef-battlefields"
          # owner-approved 2026-10-29: rows no current parcel table addresses (the July-2026 bake under the OLD
          # token ids) are dead weight — purge them (reference maps + owner-touched rows are never touched)
          MAPS_DIR="$HOME/ef-battlefields" node scripts/registry-purge-orphans.mjs --apply

      - name: Restart ef-map-service (health-gated)
        if: always()
        run: |
          pm2 restart ef-map-service || pm2 start "$HOME/ef-map-service/server.js" --name ef-map-service
          sleep 2
          for i in $(seq 1 10); do
            curl -sf http://127.0.0.1:8150/healthz && break; sleep 2
          done
          curl -sf http://127.0.0.1:8150/healthz >/dev/null || { echo "map-service failed health check after bake" >&2; exit 1; }

      - name: Census AFTER (read-only)
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/map-service"
          MAPS_DIR="$HOME/ef-battlefields" node scripts/registry-census.mjs || true
          df -h "$HOME" | tail -1
