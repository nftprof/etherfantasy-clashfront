name: Deploy MVP to cf.etherfantasy.com

# Runs on a SELF-HOSTED runner installed on the EF box (label: cf). The runner connects OUTBOUND
# to GitHub, so NO inbound SSH / port 22 is opened — the box's security group stays locked down.
# Push (or merge) to deploy/cf-mvp and this ships to https://cf.etherfantasy.com automatically.

on:
  push:
    branches: [deploy/cf-mvp]
  workflow_dispatch: {}

concurrency:
  group: cf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, cf]
    steps:
      - uses: actions/checkout@v4

      - name: Sync working copy → ~/clashfront-mvp (preserve ONLY the world save)
        run: |
          # data/ MUST sync (demo-world.json geometry fixes ship through it) — only the live
          # world save survives deploys. --delete would drop save.json without the exclude.
          rsync -a --delete --exclude='.git' --exclude='data/save.json' "$GITHUB_WORKSPACE"/ "$HOME"/clashfront-mvp/

      - name: Build + (re)start clashfront on :8130
        run: |
          cd "$HOME"/clashfront-mvp
          bash deploy/remote-deploy.sh
