name: Sync MOBA maps → engine repo

# DURABLE MAP DELIVERY (owner 2026-07-25: "what works for the future to deliver any new maps to the
# engine"). The MOBA 3D client vendors a RELATIVE copy of the battlefield maps in its OWN repo
# (etherfantasy-browser-moba-game: data/moba-maps/*.json), fetched by the client at runtime — it does
# NOT hit the map-service /internal/ endpoint (CORS + not browser-facing + egress-blocked from dev).
# So the source-of-truth maps committed here (data/moba-maps/) must be VENDORED into the engine repo.
# This job mirrors them automatically on every map change, so a new/updated map is delivered without
# anyone hand-copying a stale file (the exact drift that hid the siege castle gate).
#
# ONE-TIME SETUP (owner / deploy agent): add repo secret MOBA_MAPS_TOKEN = a fine-grained PAT (or a
# machine-user token) with Contents:write on blockchainsuperheroes/etherfantasy-browser-moba-game.
# Optionally set repo variable MOBA_MAPS_BRANCH to the branch the engine STAGING builds from (for
# fully-automatic delivery); default below pushes to a review branch you then merge.

on:
  push:
    branches: [deploy/map]
    paths: ['data/moba-maps/**']
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Engine-repo branch to push the maps to'
        required: false

concurrency:
  group: sync-moba-maps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.MOBA_MAPS_TOKEN != '' }}
    steps:
      - name: Skip notice (no token yet)
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::MOBA_MAPS_TOKEN not set — skipping engine sync. Add the secret to enable auto-delivery."

      - name: Checkout CF (map source of truth)
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
        with: { path: cf }

      - name: Resolve target branch
        if: env.HAS_TOKEN == 'true'
        id: t
        run: |
          B="${{ github.event.inputs.target_branch || vars.MOBA_MAPS_BRANCH || 'clashfront-map-sync' }}"
          echo "branch=$B" >> "$GITHUB_OUTPUT"

      - name: Checkout engine repo (destination)
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: blockchainsuperheroes/etherfantasy-browser-moba-game
          token: ${{ secrets.MOBA_MAPS_TOKEN }}
          path: engine
          fetch-depth: 0

      - name: Mirror data/moba-maps → engine (no delete — engine-only files preserved)
        if: env.HAS_TOKEN == 'true'
        run: |
          mkdir -p engine/data/moba-maps
          # copy every committed map form; keep files that only exist in the engine repo
          rsync -a --include='*/' --include='*.json' --exclude='*' cf/data/moba-maps/ engine/data/moba-maps/

      - name: Commit + push if changed
        if: env.HAS_TOKEN == 'true'
        working-directory: engine
        run: |
          BR="${{ steps.t.outputs.branch }}"
          git config user.name  "clashfront-map-bot"
          git config user.email "maps@etherfantasy.com"
          # land on the REMOTE tip of the target branch. actions/checkout only fetches the default
          # branch, so a bare `git checkout $BR` used to fall back to -b from main HEAD → the push
          # was rejected non-fast-forward on every run (and the retry loop swallowed it) → the
          # engine silently played months-stale castles. Fetch explicitly; create only if new.
          git reset --hard -q && git clean -fdq data/moba-maps   # drop the pre-step mirror; re-done below
          git fetch origin "$BR" && git checkout -B "$BR" "origin/$BR" || git checkout -B "$BR"
          # re-mirror on top of the branch tip (the pre-step rsync landed on the default checkout)
          rsync -a --include='*/' --include='*.json' --exclude='*' ../cf/data/moba-maps/ data/moba-maps/
          git add data/moba-maps
          if git diff --cached --quiet; then echo "✅ engine maps already up to date — nothing to push"; exit 0; fi
          SHA="$(git -C ../cf rev-parse --short HEAD)"
          git commit -m "maps: sync data/moba-maps from clashfront@${SHA}"
          ok=0
          for i in 1 2 3 4; do
            if git push -u origin "$BR"; then ok=1; break; fi
            sleep $((2**i)); git fetch origin "$BR" && git rebase "origin/$BR" || true
          done
          if [ "$ok" != 1 ]; then echo "::error::push to engine branch $BR FAILED after 4 attempts"; exit 1; fi
          echo "📦 pushed updated MOBA maps to engine branch: $BR"
