# cfx.etherfantasy.com — Clash Front STAGING (isolated look-and-feel preview, proxies to :8131).
# Separate from cf.etherfantasy.com (:8130) — restarting cfx never touches the live game.
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled, nginx -t, reload.
# TLS: run `certbot --nginx -d cfx.etherfantasy.com` after DNS resolves (certbot rewrites this).
server {
    listen 80;
    server_name cfx.etherfantasy.com;

    location / {
        proxy_pass http://127.0.0.1:8131;
        proxy_http_version 1.1;
        # WebSocket upgrade (game uses /ws on the same port)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived WS
        proxy_send_timeout 3600s;
    }
}
