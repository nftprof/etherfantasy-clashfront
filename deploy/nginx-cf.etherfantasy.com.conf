# cf.etherfantasy.com — Clash Front MVP (standalone site, proxies to the app on :8130)
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled, nginx -t, reload.
# TLS: run `certbot --nginx -d cf.etherfantasy.com` after DNS resolves (certbot rewrites this).
server {
    listen 80;
    server_name cf.etherfantasy.com;

    location / {
        proxy_pass http://127.0.0.1:8130;
        proxy_http_version 1.1;
        # WebSocket upgrade (game uses /ws on the same port)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived WS
        proxy_send_timeout 3600s;
    }
}
