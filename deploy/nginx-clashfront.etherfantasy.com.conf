# clashfront.etherfantasy.com — Clash Front (standalone site, proxies to the app on :8130).
# Replaces cf.etherfantasy.com (that hostname is SNI-blocked on some network paths).
# Install via the setup-clashfront workflow; certbot rewrites this to add the :443 TLS block.
server {
    listen 80;
    server_name clashfront.etherfantasy.com;

    location / {
        proxy_pass http://127.0.0.1:8130;
        proxy_http_version 1.1;
        # WebSocket upgrade (game uses /ws on the same port)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived WS
        proxy_send_timeout 3600s;
    }
}
