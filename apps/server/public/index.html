<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clash Front</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <!-- left: home rail -->
    <aside id="rail">
      <header id="rail-head">
        <span id="conn-pip" class="pip connecting" title="connection"></span>
        <span id="rail-title">CLASH FRONT</span>
        <span id="rail-player"></span>
        <a href="/help.html" target="_blank" title="How to play" style="margin-left:auto;color:#8fa0bd;text-decoration:none;font-size:13px;border:1px solid #24304a;border-radius:6px;padding:0 7px;line-height:20px">?</a>
      </header>
      <div id="rail-body"></div>
    </aside>

    <!-- map -->
    <main id="map-wrap">
      <canvas id="map"></canvas>
      <div id="tooltip" hidden></div>
      <div id="march-popover" hidden></div>
      <div id="select-banner" hidden></div>
      <div id="toasts"></div>
    </main>

    <!-- right: parcel card -->
    <aside id="card" hidden></aside>

    <!-- join overlay -->
    <div id="join" hidden>
      <form id="join-form">
        <h1>CLASH FRONT</h1>
        <p class="sub">The overworld is at war. Name your banner.</p>
        <input id="join-name" maxlength="24" placeholder="your name" autocomplete="off" required>
        <button type="submit">Enter the war</button>
        <p id="join-err" class="err"></p>
        <p class="sub" style="margin-top:10px"><a href="/help.html" target="_blank" style="color:#e8b93c">How to play →</a></p>
      </form>
    </div>

    <!-- pillage/occupy modal -->
    <div id="modal" hidden></div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
