<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clash Front</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⚔️</text></svg>">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <!-- left: home rail -->
    <aside id="rail">
      <header id="rail-head">
        <span id="conn-pip" class="pip connecting" title="connection"></span>
        <span id="rail-title">CLASH FRONT</span>
        <a href="#" id="btn-world" class="head-btn" title="World map — continents, servers &amp; travel">🌐</a>
        <a href="#" id="btn-economy" class="head-btn" title="War economy — supply, flows &amp; warzone gold rush">💰</a>
        <a href="#" id="btn-library" class="head-btn" title="Tutorial library — every lesson &amp; tip, replayable">📖</a>
        <a href="#" id="btn-tutorial" class="head-btn" title="Tutorial — replay the guided intro">🎓</a>
        <a href="/help.html" target="_blank" class="head-btn" title="How to play">?</a>
      </header>
      <!-- identity anchor: the player's Hero portrait + banner name (PO "personal touch") -->
      <div id="rail-player" hidden></div>
      <div id="rail-body"></div>
    </aside>

    <!-- map -->
    <main id="map-wrap">
      <canvas id="map"></canvas>
      <!-- jump the camera to a parcel by its token id (e.g. 60202500000) -->
      <form id="tile-search" autocomplete="off">
        <input id="tile-search-input" inputmode="numeric" maxlength="14" placeholder="Go to tile #…  e.g. 60202500000">
        <button type="submit" title="Go to tile">Go</button>
      </form>
      <div id="tooltip" hidden></div>
      <div id="march-popover" hidden></div>
      <div id="select-banner" hidden></div>
      <div id="toasts"></div>
      <div id="goal-chip" hidden></div>
      <div id="raid-banner" hidden></div>
      <!-- LIVE wild-battle viewer/steering overlay (docs/04 §7b) — js/battle.js -->
      <div id="battle" hidden>
        <div class="bt-hud"></div>
        <div class="bt-stage"><canvas id="battle-canvas"></canvas></div>
        <div class="bt-foot"></div>
      </div>
      <!-- 3D world map: continents on 3 tiers (surface/sky/underworld), fog of war,
           server-travel (docs/maps/WORLD-MAP-AND-SERVER-TRAVEL.md) — js/world.js -->
      <div id="world" hidden>
        <div class="wm-hud"></div>
        <canvas id="world-canvas"></canvas>
        <div class="wm-panel" hidden></div>
      </div>
    </main>

    <!-- right: parcel card -->
    <aside id="card" hidden></aside>

    <!-- join overlay: dev name-only form by default; the PG sign-in fields replace it
         when /api/world meta says pgEnabled (docs/briefs/PG-IDENTITY.md) -->
    <div id="join" hidden>
      <form id="join-form">
        <h1>CLASH FRONT</h1>
        <p class="sub" id="join-sub">The overworld is at war. Name your banner — an existing name resumes that governor.</p>
        <input id="join-name" maxlength="24" placeholder="your name" autocomplete="off" required>
        <input id="join-pg-id" placeholder="email / PNS name / username" autocomplete="username" hidden>
        <input id="join-pg-pass" type="password" placeholder="password" autocomplete="current-password" hidden>
        <button type="submit" id="join-btn">Enter the war</button>
        <p id="join-err" class="err"></p>
        <p class="sub"><a href="#" id="join-alt" hidden></a></p>
        <p class="sub" style="margin-top:10px"><a href="/help.html" target="_blank" style="color:#e8b93c">How to play →</a></p>
      </form>
    </div>

    <!-- pillage/occupy modal -->
    <div id="modal" hidden></div>

    <!-- FTUE spotlight overlay (4-panel dim + ring + coach-mark card, js/ftue.js) -->
    <div id="ftue" hidden>
      <div class="ftue-dim" data-d="t"></div>
      <div class="ftue-dim" data-d="b"></div>
      <div class="ftue-dim" data-d="l"></div>
      <div class="ftue-dim" data-d="r"></div>
      <div class="ftue-ring"></div>
      <div class="ftue-card"></div>
    </div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
